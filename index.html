<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3반 웹사이트</title>
<meta name="theme-color" content="#3268e8">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

:root{
  --main:#3268e8;
  --dark:#2453c7;
  --light:#edf2fe;
  --bg:#f4f5f7;
  --surface:#ffffff;
  --surface-2:#f6f7f9;
  --border:#e5e8eb;
  --border-strong:#d1d6db;
  --danger:#e5484d;
  --danger-soft:#fdeeee;
  --success:#1f9d55;
  --success-soft:#e7f6ee;
  --warn:#a76a00;
  --warn-soft:#fff5dc;
  --text:#191f28;
  --text-2:#4e5968;
  --muted:#8b95a1;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 16px 40px rgba(16,24,40,.14)
}

html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:15px;
  line-height:1.55;
  word-break:keep-all;
  overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased
}

body.font-cute{ font-family:"Gaegu","Pretendard Variable",cursive }
body.font-round{ font-family:"Nanum Gothic","Pretendard Variable",sans-serif }
body.font-serif{ font-family:"Nanum Myeongjo",serif }

button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{line-height:1.35;letter-spacing:-.02em}

/* ---------- 헤더 / 메뉴 ---------- */
header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border)}
.top{max-width:1080px;margin:auto;padding:12px 20px 4px;display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;letter-spacing:-.02em;cursor:pointer}
.logo img{flex-shrink:0;border-radius:9px}
.logo small{display:block;margin-top:1px;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:0}
.user-area{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#userInfo{display:flex;align-items:center;gap:6px}
.user-badge{padding:4px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:13px;font-weight:600}
.points-badge{padding:4px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:700;white-space:nowrap}

.nav-inner{max-width:1080px;margin:auto;padding:0 12px;display:flex;overflow-x:auto;scrollbar-width:none}
.nav-inner::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;padding:10px 10px 11px;border:0;border-bottom:2px solid transparent;background:none;white-space:nowrap;font-size:14px;font-weight:600;color:var(--muted);transition:color .15s}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--text);border-bottom-color:var(--main)}

main{max-width:1080px;margin:28px auto 48px;padding:0 20px}
.site-footer{max-width:1080px;margin:0 auto;padding:0 20px 36px;text-align:center;color:var(--muted);font-size:12px}

.page-title{margin-bottom:20px}
.page-title h1{margin:0 0 4px;font-size:24px;font-weight:800}
.page-title p{margin:0;color:var(--muted);font-size:14px}
.sub-heading{margin:28px 0 10px;font-size:15px;font-weight:700;color:var(--text-2)}

/* ---------- 카드 ---------- */
.card,.table-wrap,.poll,.stat-card,.game-card,.shop-item,.dday-card,.list,.board,.calendar,.admin-box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)
}
.card{padding:20px}
.card h3{margin:0 0 12px;font-size:16px;font-weight:700}
.card-desc{margin:-4px 0 14px;color:var(--text-2);font-size:14px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.section-head h3{margin:0}
.link-btn{padding:2px 0;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.link-btn:hover{color:var(--main)}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar-count{color:var(--muted);font-size:14px}
.toolbar-right{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;min-width:0}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-row.end{justify-content:flex-end}

/* ---------- 버튼 ---------- */
.primary,.outline,.danger,.ghost{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:38px;padding:0 14px;border:1px solid transparent;border-radius:var(--radius-sm);
  font-size:14px;font-weight:600;white-space:nowrap;text-decoration:none;
  transition:background .15s,border-color .15s,color .15s
}
.primary{background:var(--main);color:#fff}
.primary:hover{background:var(--dark)}
.outline{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.outline:hover{background:var(--surface-2)}
.danger{background:var(--surface);border-color:#f2c4c6;color:var(--danger)}
.danger:hover{background:var(--danger-soft)}
.ghost{padding:0 10px;background:none;color:var(--text-2)}
.ghost:hover{background:rgba(0,0,0,.04);color:var(--text)}
.btn-sm{min-height:32px;padding:0 10px;border-radius:8px;font-size:13px}
.primary:disabled,.outline:disabled,.danger:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 표 ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;min-width:640px;border-collapse:collapse;font-size:14px}
th,td{padding:11px 14px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{background:var(--surface-2);color:var(--text-2);font-size:13px;font-weight:600}
tr:last-child td{border-bottom:0}
.empty{padding:48px 20px!important;text-align:center;color:var(--muted)}

/* ---------- 입력 ---------- */
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:14px;font-weight:600;color:var(--text-2)}
.input,.form-group input,.form-group textarea,.form-group select,.login-box input{
  width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s
}
.input:focus,.form-group input:focus,.form-group textarea:focus,.form-group select:focus,.login-box input:focus{
  border-color:var(--main);box-shadow:0 0 0 3px rgba(50,104,232,.15)
}
.input:disabled,.form-group input:disabled{background:var(--surface-2);color:var(--muted)}
textarea{min-height:140px;resize:vertical;line-height:1.6}
.hint{margin:-6px 0 16px;color:var(--muted);font-size:13px}
.inline-form{display:flex;gap:8px;align-items:center}
.inline-form .input{flex:1;min-width:0}

/* ---------- 모달 ---------- */
.modal-bg{position:fixed;inset:0;z-index:10001;display:none;justify-content:center;align-items:center;padding:20px;background:rgba(17,24,39,.45)}
.modal{position:relative;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:26px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg)}
.modal h2{margin:0 0 12px;padding-right:40px;font-size:20px}
.modal-close{position:absolute;top:16px;right:16px;width:34px;height:34px;border:0;border-radius:50%;background:var(--surface-2);color:var(--text-2);font-size:20px;line-height:1}
.modal-close:hover{background:var(--border)}
.modal-body{margin-top:14px;white-space:pre-wrap;line-height:1.7}
.modal-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.modal-section h3{margin:0 0 6px;font-size:15px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* ---------- 로그인 ---------- */
.login-page{position:fixed;inset:0;z-index:10000;display:flex;justify-content:center;align-items:center;padding:20px;background:var(--bg)}
.login-box{width:380px;max-width:100%;padding:36px 28px 28px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg)}
.login-mark{display:block;width:56px;height:56px;margin:0 auto 14px;border-radius:16px}
.login-box h1{margin:0 0 4px;text-align:center;font-size:22px}
.login-sub{margin:0 0 26px;text-align:center;color:var(--muted);font-size:14px}
.login-box .primary{width:100%;min-height:46px;margin-top:6px;font-size:15px}
.login-help{margin:12px 0 0;text-align:center;color:var(--muted);font-size:12px}

/* ---------- 관리자 ---------- */
.admin-title{margin:36px 0 14px;font-size:18px}
.admin-box{padding:20px;margin-bottom:14px}
.admin-box strong{display:block;margin-bottom:4px;font-size:15px}
.admin-box p{margin:0 0 14px;color:var(--text-2);font-size:14px}
.admin-box .table-wrap{box-shadow:none}
.point-input{flex:none!important;width:76px!important;padding:6px 8px!important;text-align:center}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.stat-card{padding:16px;text-align:center;font-size:13px;color:var(--text-2)}
.stat-card b{display:block;margin-top:4px;font-size:24px;color:var(--text)}
.old-post-row{display:flex;align-items:center;gap:12px;padding:12px 0}
.old-post-row + .old-post-row{border-top:1px solid var(--border)}

/* ---------- 캘린더 ---------- */
.calendar{overflow:hidden}
.calendar-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.calendar-head b{font-size:17px}
.calendar-scroll{overflow-x:auto}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:600px}
.day-head{padding:9px 0;border-bottom:1px solid var(--border);text-align:center;font-size:12px;font-weight:600;color:var(--text-2)}
.day{min-width:0;min-height:98px;padding:6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.day:nth-child(7n){border-right:0}
.day:nth-last-child(-n+7){border-bottom:0}
.empty-day{background:var(--surface-2)}
.day-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:600}
.day-head.sun,.day.sun .day-num{color:var(--danger)}
.day-head.sat,.day.sat .day-num{color:var(--main)}
.day.today .day-num{background:var(--main);color:#fff}
.event{margin-top:3px;padding:2px 6px;border-radius:6px;background:var(--light);color:var(--main);font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event.assignment{background:var(--warn-soft);color:var(--warn)}
.calendar-legend{display:flex;gap:14px;padding:12px 18px;border-top:1px solid var(--border);color:var(--text-2);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:50%;background:var(--main);vertical-align:middle}
.dot.assignment{background:var(--warn)}

/* ---------- 목록 ---------- */
.list{overflow:hidden}
.list-item{display:flex;align-items:center;gap:14px;padding:14px 18px}
.list-item + .list-item{border-top:1px solid var(--border)}
.list-item.clickable{cursor:pointer;transition:background .12s}
.list-item.clickable:hover{background:var(--surface-2)}
.list-main{flex:1;min-width:0}
.list-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-desc{margin-top:2px;color:var(--text-2);font-size:14px;white-space:pre-wrap;word-break:break-word}
.list-desc.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.list-sub{margin-top:3px;color:var(--muted);font-size:13px}
.list-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.list-actions{display:flex;gap:6px}
.list-arrow{color:var(--border-strong);font-size:22px;line-height:1}
.list-empty{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px}
.list-past .list-item{opacity:.6}
.date-tile{flex-shrink:0;width:50px;padding:6px 0;border-radius:12px;background:var(--surface-2);text-align:center;line-height:1.2}
.date-tile .m{display:block;color:var(--muted);font-size:11px;font-weight:600}
.date-tile .d{display:block;font-size:19px;font-weight:800}
.date-tile .w{display:block;color:var(--muted);font-size:11px}

.preview-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.preview-row + .preview-row{border-top:1px solid var(--border)}
.preview-title{min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-row:hover .preview-title{color:var(--main)}
.preview-row > .meta,.preview-row > .badge{flex-shrink:0}

.meta{color:var(--muted);font-size:13px}

/* ---------- 투표 ---------- */
.poll{padding:20px;margin-bottom:14px}
.poll-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.poll-head h3{margin:0 0 4px;font-size:17px}
.poll-desc{margin:12px 0 0;color:var(--text-2);white-space:pre-wrap}
.poll-options{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.poll-option{width:100%;padding:12px 14px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);text-align:left;font-weight:500;transition:background .15s,border-color .15s,color .15s}
.poll-option:hover{border-color:var(--main);background:var(--light);color:var(--main)}
.poll-done{margin:14px 0 0;color:var(--main);font-size:14px;font-weight:600}
.poll-admin{display:flex;justify-content:flex-end;margin-top:16px}
.vote-result{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.vote-row + .vote-row{margin-top:12px}
.vote-row-head{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.vote-row-head span:last-child{color:var(--muted);white-space:nowrap}
.vote-row.mine .vote-row-head span:first-child{color:var(--main);font-weight:700}
.vote-bar{height:8px;margin-top:6px;border-radius:999px;background:#eef0f3;overflow:hidden}
.vote-bar-inner{height:100%;border-radius:999px;background:#b9cbf6;transition:width .3s}
.vote-row.mine .vote-bar-inner{background:var(--main)}
.vote-option-inputs{display:flex;flex-direction:column;gap:8px}

/* ---------- 자체 아이콘 ---------- */
.ic{width:1.15em;height:1.15em;flex-shrink:0;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-animal{width:1.45em;height:1.45em;vertical-align:-.35em;flex-shrink:0}
.badge .ic-animal.title-animal{width:1.7em;height:1.7em;margin:-4px -2px}
h1 .ic,h2 .ic,h3 .ic{color:var(--main);margin-right:2px}
.shop-item .icon{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;background:var(--light);color:var(--main)}
.shop-item .icon .ic{width:24px;height:24px}
.shop-item .icon .ic-animal{width:36px;height:36px}
.game-icon{color:var(--main)}
.game-icon .ic{width:28px;height:28px}
.points-badge .ic,.price .ic{color:var(--warn)}
.like-icon{filter:none!important;opacity:1!important;color:var(--muted)}
.like-icon .ic{width:24px;height:24px}
.like-btn.active .like-icon{color:#ef4565}
.like-btn.active .like-icon .ic{fill:#ef4565}
.lock-banner .ic,.feed-warning .ic,.notify-banner .ic{margin-right:2px}

/* ---------- 사이트 이모티콘 ---------- */
.emo{width:1.6em;height:1.6em;vertical-align:-.45em;margin:0 1px}
.emo-ic{display:inline-flex;vertical-align:-.4em}
.emo-ic .ic{width:1.45em;height:1.45em}
.emo-ic .ic{fill:currentColor;fill-opacity:.18}
.emo-big .emo{width:72px;height:72px}
.emo-big .emo-ic .ic{width:64px;height:64px}
.emo-picker{position:relative;display:inline-flex;flex-shrink:0}
.emo-toggle{width:38px;padding:0;justify-content:center}
.emo-toggle .ic{width:20px;height:20px}
.emo-pop{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:20;width:286px;padding:8px;gap:2px;grid-template-columns:repeat(7,1fr);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg)}
.emo-picker.open .emo-pop{display:grid}
.emo-pop button{display:flex;align-items:center;justify-content:center;height:38px;padding:0;border:0;border-radius:10px;background:none;font-size:15px}
.emo-pop button:hover{background:var(--surface-2)}
.emo-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.emo-row .emo-pop{left:0;right:auto}

/* ---------- 프로필 ---------- */
.profile-box{
  --frame:var(--border);--tint:var(--surface);--accent:var(--main);
  position:relative;display:flex;align-items:center;gap:16px;
  padding:20px 22px;margin-bottom:16px;overflow:hidden;
  background:var(--tint);border:1px solid var(--frame);border-radius:var(--radius);
}
.profile-box > *{position:relative;z-index:1}
.profile-box > div:last-child{min-width:0;flex:1}
.avatar{
  width:52px;height:52px;flex-shrink:0;border-radius:50%;
  display:flex;justify-content:center;align-items:center;
  background:var(--accent,var(--main));color:#fff;font-weight:800;font-size:17px;
}
.profile-name{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:18px;line-height:1.35}
.profile-name b{overflow-wrap:anywhere}
.profile-box .meta{margin-top:3px}
.profile-status{margin-top:8px;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.04);color:var(--text-2);font-size:14px;overflow-wrap:anywhere}

/* 테두리 아이템: 색만 바꾸고 모양은 통일 (글자를 가리지 않게) */
.profile-box[class*="border-"]{border:2px solid var(--frame);box-shadow:0 0 0 3px var(--glow),0 6px 18px var(--glow)}
.profile-box[class*="border-"]::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--stripe);z-index:0}
.profile-box[class*="border-"] .avatar{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--frame)}

.border-neon    {--frame:#00c2e8;--glow:rgba(0,194,232,.18);--tint:linear-gradient(135deg,#eafcff,#fff 60%);--accent:#0a9fc0;--stripe:linear-gradient(90deg,#00d8ff,#6ef0ff)}
.border-gold    {--frame:#d9a529;--glow:rgba(217,165,41,.18);--tint:linear-gradient(135deg,#fff8e1,#fff 60%);--accent:#c48f12;--stripe:linear-gradient(90deg,#f6d678,#d9a529,#f6d678)}
.border-gradient{--frame:#8b7bff;--glow:rgba(123,96,255,.16);--tint:linear-gradient(135deg,#fbefff,#eef4ff 50%,#fff);--accent:#7c6cf0;--stripe:linear-gradient(90deg,#ff8ec7,#7c7bff,#7ef7bf)}
.border-vine    {--frame:#2ea95e;--glow:rgba(46,169,94,.16);--tint:linear-gradient(135deg,#ecfdf3,#fff 60%);--accent:#2ea95e;--stripe:linear-gradient(90deg,#a8e6a8,#2ea95e)}
.border-branch  {--frame:#8c5b34;--glow:rgba(122,75,30,.14);--tint:linear-gradient(135deg,#faf0e6,#fff 60%);--accent:#8c5b34;--stripe:linear-gradient(90deg,#d6b38b,#8c5b34)}
.border-thorn   {--frame:#b95fc6;--glow:rgba(185,95,198,.16);--tint:linear-gradient(135deg,#fdf0ff,#fff 60%);--accent:#b95fc6;--stripe:linear-gradient(90deg,#f5d0ff,#b95fc6)}
.border-spark   {--frame:#f0a800;--glow:rgba(255,183,3,.18);--tint:linear-gradient(135deg,#fff7d6,#fff 60%);--accent:#e09a00;--stripe:linear-gradient(90deg,#ffd166,#ffb703)}
.border-crystal {--frame:#5da7ff;--glow:rgba(93,167,255,.18);--tint:linear-gradient(135deg,#edf6ff,#fff 60%);--accent:#4a8fe6;--stripe:linear-gradient(90deg,#a7d8ff,#5da7ff)}
.border-comet   {--frame:#ff5d5d;--glow:rgba(255,93,93,.15);--tint:linear-gradient(135deg,#fff0f0,#fff 60%);--accent:#ef4b4b;--stripe:linear-gradient(90deg,#ffb5b5,#ff5d5d)}
.border-ribbon  {--frame:#b35eff;--glow:rgba(179,94,255,.15);--tint:linear-gradient(135deg,#f8eeff,#fff 60%);--accent:#a24ef0;--stripe:linear-gradient(90deg,#d7a8ff,#b35eff)}
.border-lotus   {--frame:#ff7ea6;--glow:rgba(255,126,166,.16);--tint:linear-gradient(135deg,#fff0f5,#fff 60%);--accent:#f0628f;--stripe:linear-gradient(90deg,#ffdfe9,#ff7ea6,#b8f2ea)}
.border-crown   {--frame:#f2b600;--glow:rgba(255,201,61,.2);--tint:linear-gradient(135deg,#fffbe6,#fff 60%);--accent:#d9a100;--stripe:linear-gradient(90deg,#fff3c8,#ffc93d)}
.border-wing    {--frame:#2bb5b6;--glow:rgba(50,199,200,.16);--tint:linear-gradient(135deg,#eaffff,#fff 60%);--accent:#24a3a4;--stripe:linear-gradient(90deg,#9ce9ef,#32c7c8)}
.border-nova    {--frame:#7d63ff;--glow:rgba(125,99,255,.16);--tint:linear-gradient(135deg,#f1eeff,#fff 60%);--accent:#6c52f0;--stripe:linear-gradient(90deg,#b8b3ff,#7d63ff)}
.border-spire   {--frame:#ff7a18;--glow:rgba(255,122,24,.16);--tint:linear-gradient(135deg,#fff3e8,#fff 60%);--accent:#ec6a0b;--stripe:linear-gradient(90deg,#ffd39a,#ff7a18)}

/* ---------- 테두리별 개성 (장식은 모두 글자 뒤/모서리에만) ---------- */
.profile-box[class*="border-"]{padding-right:52px}
.profile-box[class*="border-"]::after{position:absolute;z-index:0;pointer-events:none}
@keyframes pf-glow{50%{box-shadow:0 0 0 3px rgba(0,216,255,.35),0 0 26px rgba(0,216,255,.55)}}
@keyframes pf-twinkle{50%{opacity:.25;transform:scale(.8) rotate(20deg)}}
@keyframes pf-slide{from{background-position:0 0}to{background-position:200% 0}}
@keyframes pf-comet{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(320%) skewX(-20deg)}}
@keyframes pf-float{50%{transform:translateY(-4px)}}

/* 네온: 어두운 카드 + 깜빡이는 빛 */
.profile-box.border-neon{--tint:linear-gradient(135deg,#071a26,#0c2a3a);color:#e6f9ff;animation:pf-glow 2.4s ease-in-out infinite;border-radius:14px}
.profile-box.border-neon .meta{color:rgba(230,249,255,.7)}
.profile-box.border-neon .profile-status{background:rgba(0,216,255,.12);color:#bff4ff}
.profile-box.border-neon .avatar{box-shadow:0 0 0 2px #071a26,0 0 0 4px #00d8ff,0 0 14px #00d8ff}
.profile-box.border-neon::before{height:2px;top:auto;bottom:0;box-shadow:0 0 10px #00d8ff}

/* 골드: 이중 테두리 + 모서리 장식 */
.profile-box.border-gold{border:4px double #d9a529;border-radius:6px}
.profile-box.border-gold::before{display:none}
.profile-box.border-gold::after{content:"";inset:6px;border:1px solid rgba(217,165,41,.45);border-radius:2px;
  background:
   linear-gradient(#d9a529,#d9a529) left top/14px 2px no-repeat,linear-gradient(#d9a529,#d9a529) left top/2px 14px no-repeat,
   linear-gradient(#d9a529,#d9a529) right top/14px 2px no-repeat,linear-gradient(#d9a529,#d9a529) right top/2px 14px no-repeat,
   linear-gradient(#d9a529,#d9a529) left bottom/14px 2px no-repeat,linear-gradient(#d9a529,#d9a529) left bottom/2px 14px no-repeat,
   linear-gradient(#d9a529,#d9a529) right bottom/14px 2px no-repeat,linear-gradient(#d9a529,#d9a529) right bottom/2px 14px no-repeat}
.profile-box.border-gold .avatar{border-radius:12px;background:linear-gradient(135deg,#f6d678,#c48f12)}

/* 그라데이션: 흐르는 무지개 테두리 */
.profile-box.border-gradient{border:3px solid transparent;border-radius:20px;
  background:linear-gradient(135deg,#fbf3ff,#f2f6ff) padding-box,linear-gradient(90deg,#ff8ec7,#7c7bff,#7ef7bf,#ff8ec7) border-box;
  background-size:100% 100%,200% 100%;animation:pf-slide 4s linear infinite}
.profile-box.border-gradient::before{display:none}
.profile-box.border-gradient .avatar{background:linear-gradient(135deg,#ff8ec7,#7c7bff,#7ef7bf)}

/* 덩굴: 점선 + 잎사귀 */
.profile-box.border-vine{border-style:dashed;border-radius:24px 6px 24px 6px}
.profile-box.border-vine::before{height:100%;width:6px;background:repeating-linear-gradient(180deg,#2ea95e 0 10px,#a8e6a8 10px 16px)}
.profile-box.border-vine::after{content:"";right:10px;top:8px;width:26px;height:26px;background:var(--frame);-webkit-mask:var(--deco) center/contain no-repeat;mask:var(--deco) center/contain no-repeat;transform:rotate(25deg)}

/* 나무: 나뭇결 무늬 */
.profile-box.border-branch{border-radius:8px;border-width:3px}
.profile-box.border-branch::before{height:100%;background:repeating-linear-gradient(100deg,transparent 0 22px,rgba(140,91,52,.06) 22px 26px);}
.profile-box.border-branch::after{content:"";right:10px;bottom:6px;width:26px;height:26px;background:var(--frame);-webkit-mask:var(--deco) center/contain no-repeat;mask:var(--deco) center/contain no-repeat}
.profile-box.border-branch .avatar{border-radius:10px}

/* 가시: 마름모 무늬 띠 */
.profile-box.border-thorn{border-style:dotted;border-width:3px;border-radius:4px 22px 4px 22px}
.profile-box.border-thorn::before{height:8px;background:linear-gradient(135deg,#b95fc6 25%,transparent 25%) -6px 0/12px 8px,linear-gradient(225deg,#b95fc6 25%,transparent 25%) -6px 0/12px 8px}
.profile-box.border-thorn .avatar{border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);width:58px;height:58px}

/* 스파크: 반짝이 */
.profile-box.border-spark::after{content:"";right:12px;top:10px;width:24px;height:24px;background:var(--frame);-webkit-mask:var(--deco) center/contain no-repeat;mask:var(--deco) center/contain no-repeat;animation:pf-twinkle 1.6s ease-in-out infinite}
.profile-box.border-spark::before{height:100%;background:radial-gradient(circle at 88% 78%,rgba(255,183,3,.6) 0 2px,transparent 3px),radial-gradient(circle at 70% 20%,rgba(255,183,3,.5) 0 2px,transparent 3px),radial-gradient(circle at 95% 45%,rgba(255,183,3,.5) 0 1.5px,transparent 2.5px)}

/* 크리스탈: 모서리 깎인 보석 (모서리만 살짝) */
.profile-box.border-crystal{border-radius:0;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);box-shadow:none;border-width:3px}
.profile-box.border-crystal::before{height:100%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.8) 48%,transparent 56%),linear-gradient(135deg,rgba(93,167,255,.12),transparent 50%)}
.profile-box.border-crystal::after{content:"";right:14px;top:10px;width:24px;height:24px;background:var(--frame);-webkit-mask:var(--deco) center/contain no-repeat;mask:var(--deco) center/contain no-repeat}
.profile-box.border-crystal .avatar{border-radius:0;clip-path:polygon(50% 0,100% 28%,100% 72%,50% 100%,0 72%,0 28%)}

/* 혜성: 지나가는 빛줄기 */
.profile-box.border-comet::before{top:0;height:100%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,93,93,.18),transparent);animation:pf-comet 3.5s ease-in-out infinite}
.profile-box.border-comet::after{content:"";right:12px;top:8px;width:24px;height:24px;background:var(--frame);-webkit-mask:var(--deco) center/contain no-repeat;mask:var(--deco) center/contain no-repeat}

/* 리본: 비대칭 + 리본 */
.profile-box.border-ribbon{border-radius:28px 8px 28px 8px}
.profile-box.border-ribbon::before{height:100%;width:auto;left:auto;right:28px;width:14px;background:linear-gradient(#d7a8ff,#b35eff)}
.profile-box.border-ribbon::after{content:"";right:14px;top:-2px;width:30px;height:30px;background:var(--frame);-webkit-mask:var(--deco) center/contain no-repeat;mask:var(--deco) center/contain no-repeat}

/* 연꽃: 둥근 카드 + 꽃잎 */
.profile-box.border-lotus{border-radius:32px}
.profile-box.border-lotus::before{height:100%;background:radial-gradient(circle at 100% 100%,rgba(255,126,166,.18) 0 60px,transparent 61px),radial-gradient(circle at 0 0,rgba(184,242,234,.35) 0 50px,transparent 51px)}
.profile-box.border-lotus::after{content:"";right:14px;top:10px;width:24px;height:24px;background:var(--frame);-webkit-mask:var(--deco) center/contain no-repeat;mask:var(--deco) center/contain no-repeat;animation:pf-float 3s ease-in-out infinite}

/* 왕관: 아바타 위 왕관 */
.profile-box.border-crown{border-radius:10px}
.profile-box.border-crown::before{height:7px;background:linear-gradient(135deg,transparent 50%,#ffc93d 50%) 0 0/14px 7px,linear-gradient(225deg,transparent 50%,#ffc93d 50%) 0 0/14px 7px}
.profile-box.border-crown .avatar{position:relative;margin-top:8px}
.profile-box.border-crown .avatar::before{content:"";--deco:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M3%208l4.5%204L12%205l4.5%207L21%208l-2%2011H5L3%208z%22%2F%3E%3C%2Fsvg%3E");position:absolute;top:-19px;left:50%;transform:translateX(-50%) rotate(-10deg);width:24px;height:24px;background:var(--frame);-webkit-mask:var(--deco) center/contain no-repeat;mask:var(--deco) center/contain no-repeat}

/* 날개: 양쪽 날개 장식 */
.profile-box.border-wing{border-radius:40px 14px 40px 14px}
.profile-box.border-wing::before{height:100%;background:radial-gradient(ellipse 60px 30px at 0 50%,rgba(50,199,200,.2),transparent),radial-gradient(ellipse 60px 30px at 100% 50%,rgba(50,199,200,.2),transparent)}
.profile-box.border-wing::after{content:"";right:12px;top:8px;width:24px;height:24px;background:var(--frame);-webkit-mask:var(--deco) center/contain no-repeat;mask:var(--deco) center/contain no-repeat;animation:pf-float 2.6s ease-in-out infinite}

/* 노바: 밤하늘 */
.profile-box.border-nova{--tint:radial-gradient(circle at 85% 20%,#3b2a8a,#1a1440 70%);color:#f1eeff;border-radius:18px}
.profile-box.border-nova .meta{color:rgba(241,238,255,.7)}
.profile-box.border-nova .profile-status{background:rgba(255,255,255,.1);color:#e3dcff}
.profile-box.border-nova::before{height:100%;background:radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 60% 80%,#fff 0 1px,transparent 2px),radial-gradient(circle at 80% 40%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 40% 55%,rgba(255,255,255,.7) 0 1px,transparent 2px),radial-gradient(circle at 92% 85%,#fff 0 1px,transparent 2px)}
.profile-box.border-nova::after{content:"";right:14px;top:10px;width:24px;height:24px;background:var(--frame);-webkit-mask:var(--deco) center/contain no-repeat;mask:var(--deco) center/contain no-repeat}
.profile-box.border-nova .avatar{box-shadow:0 0 0 2px #1a1440,0 0 0 4px #b8b3ff,0 0 16px #7d63ff}

/* 첨탑: 성벽 모양 윗단 */
.profile-box.border-spire{border-radius:4px;padding-top:28px}
.profile-box.border-spire::before{height:12px;background:linear-gradient(90deg,#ff7a18 50%,transparent 50%) 0 0/24px 12px,linear-gradient(#ff7a18,#ff7a18) 0 8px/100% 4px no-repeat}
.profile-box.border-spire::after{content:"";right:12px;bottom:8px;width:24px;height:24px;background:var(--frame);-webkit-mask:var(--deco) center/contain no-repeat;mask:var(--deco) center/contain no-repeat}
.profile-box.border-spire .avatar{border-radius:6px}

@media (prefers-reduced-motion:reduce){.profile-box,.profile-box *,.profile-box::before,.profile-box::after{animation:none!important}}

/* ---------- 프로필 레이아웃: 커버 + 가운데 아바타 카드 ---------- */
.profile-box,.profile-box[class*="border-"]{flex-direction:column;align-items:center;text-align:center;gap:0;padding:0 0 20px}
.profile-box.border-spire{padding-top:0}
.profile-cover{align-self:stretch;height:92px;
  background:var(--cover,linear-gradient(135deg,var(--main),#8fb0ff));}
.profile-box .avatar,.profile-box[class*="border-"] .avatar{width:80px;height:80px;font-size:26px;margin-top:-40px;
  box-shadow:0 0 0 5px #fff,0 0 0 7px var(--frame,transparent),0 6px 16px rgba(0,0,0,.12)}
.profile-box > div:last-child{width:100%;padding:12px 22px 0}
.profile-name{justify-content:center;font-size:21px}
.profile-box .meta{margin-top:6px}
.profile-status{display:inline-block;margin-top:12px;padding:8px 14px;border-radius:14px;position:relative}
.profile-status::before{content:"";position:absolute;top:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom-color:rgba(0,0,0,.04)}
.profile-box[class*="border-"]::after{top:100px}
.profile-box.border-crown .avatar{margin-top:-40px}
.profile-box.border-crown .avatar::before{top:-30px;width:32px;height:32px}

/* 테두리별 커버 */
.border-neon    {--cover:linear-gradient(rgba(0,216,255,.25) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,rgba(0,216,255,.25) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(135deg,#02121c,#06425a)}
.border-gold    {--cover:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 8px,transparent 8px 16px),linear-gradient(135deg,#f6d678,#d9a529,#b07d10)}
.border-gradient{--cover:linear-gradient(90deg,#ff8ec7,#7c7bff,#7ef7bf)}
.border-vine    {--cover:radial-gradient(circle at 20% 120%,#2ea95e 0 40px,transparent 41px),radial-gradient(circle at 70% 130%,#3bb273 0 60px,transparent 61px),linear-gradient(#d1f4d4,#a8e6a8)}
.border-branch  {--cover:repeating-linear-gradient(95deg,#8c5b34 0 14px,#9d6a40 14px 18px,#7a4b1e 18px 30px)}
.border-thorn   {--cover:linear-gradient(135deg,#b95fc6 25%,transparent 25%) 0 0/24px 24px,linear-gradient(225deg,#b95fc6 25%,transparent 25%) 0 0/24px 24px,linear-gradient(#f5d0ff,#e3a6ee)}
.border-spark   {--cover:radial-gradient(circle at 15% 30%,#fff 0 2px,transparent 3px),radial-gradient(circle at 45% 70%,#fff 0 3px,transparent 4px),radial-gradient(circle at 80% 25%,#fff 0 2px,transparent 3px),linear-gradient(135deg,#ffd166,#ffb703)}
.border-crystal {--cover:linear-gradient(115deg,#a7d8ff 0 30%,#7cc0ff 30% 55%,#5da7ff 55% 75%,#4a8fe6 75%)}
.border-comet   {--cover:linear-gradient(160deg,transparent 45%,#ffb5b5 46% 50%,transparent 51%),linear-gradient(135deg,#3a0d1a,#8c1f2d)}
.border-ribbon  {--cover:repeating-linear-gradient(135deg,#d7a8ff 0 12px,#c48bff 12px 24px)}
.border-lotus   {--cover:radial-gradient(circle at 25% 60%,#ffc1d4 0 22px,transparent 23px),radial-gradient(circle at 75% 40%,#ffd6e3 0 30px,transparent 31px),linear-gradient(135deg,#ffdfe9,#b8f2ea)}
.border-crown   {--cover:linear-gradient(135deg,#ffe58a,#ffc93d 60%,#e5a800)}
.border-wing    {--cover:radial-gradient(ellipse 120px 50px at 50% 110%,#fff,transparent),linear-gradient(#9ce9ef,#32c7c8)}
.border-nova    {--cover:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 60%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 85% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 40% 80%,#fff 0 1px,transparent 2px),linear-gradient(135deg,#1a1440,#4b3aa8)}
.border-spire   {--cover:linear-gradient(#fff 50%,transparent 50%) 0 0/28px 20px repeat-x,linear-gradient(#ffd39a,#ff7a18)}
.profile-box.border-neon .avatar,.profile-box.border-nova .avatar{color:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.15),0 0 0 7px var(--frame),0 0 18px var(--frame)}
.profile-box.border-thorn .avatar,.profile-box.border-crystal .avatar{width:88px;height:88px;margin-top:-44px}
.profile-box.border-gold .avatar,.profile-box.border-branch .avatar,.profile-box.border-spire .avatar{border-radius:18px}

/* 목록에 나오는 작은 아바타 */
.avatar[class*="border-"]{background:var(--accent);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--frame)}

@media (max-width:480px){
  .profile-box .avatar,.profile-box[class*="border-"] .avatar{width:68px;height:68px;font-size:22px;margin-top:-34px}
  .profile-cover{height:76px}
  .profile-name{font-size:16px}
}

.handle-link{cursor:pointer}
.handle-link:hover{color:var(--main);text-decoration:underline}

/* ---------- 시간표 / 급식 ---------- */
.date-nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.date-nav strong{min-width:118px;text-align:center;font-size:13px;font-weight:600;color:var(--text-2)}
.date-nav .outline{min-height:28px;padding:0 8px;border-radius:8px;font-size:12px}
.timetable-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.timetable-row + .timetable-row{border-top:1px solid var(--border)}
.meal-block + .meal-block{margin-top:14px}
.meal-list{margin:6px 0 0;padding-left:18px;line-height:1.9}
.allergy{margin-left:4px;color:var(--muted);font-size:12px}
.meal-page-card{max-width:620px}

/* ---------- 배지 ---------- */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;background:#eef0f3;color:var(--text-2);font-size:11px;font-weight:700;line-height:1.6;white-space:nowrap;vertical-align:middle}
.badge-admin{background:var(--danger-soft);color:#c62f35}
.badge-teacher{background:var(--warn-soft);color:var(--warn)}
.badge-student{background:var(--light);color:var(--main)}
.badge-title{background:#f3ecff;color:#7c3aed}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-accent{background:var(--light);color:var(--main)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-muted{background:var(--surface-2);color:var(--muted)}

/* ---------- 홈 ---------- */
.home-hello{margin-bottom:20px}
.home-hello h1{margin:0 0 4px;font-size:24px;font-weight:800}
.home-hello p{margin:0;color:var(--muted);font-size:14px}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.dday-row{display:flex;gap:10px;margin-bottom:16px;padding-bottom:2px;overflow-x:auto;scrollbar-width:none}
.dday-row::-webkit-scrollbar{display:none}
.dday-card{flex:0 0 172px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.dday-card:hover{border-color:var(--main)}
.dday-num{font-size:20px;font-weight:800;color:var(--main)}
.dday-num.urgent{color:var(--danger)}
.dday-label{margin-top:2px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dday-type{margin-top:2px;color:var(--muted);font-size:12px}
.rank-group + .rank-group{margin-top:14px}
.rank-group-title{margin-bottom:2px;color:var(--muted);font-size:12px;font-weight:600}
.leaderboard-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.leaderboard-row + .leaderboard-row{border-top:1px solid var(--border)}
.leaderboard-row.clickable{cursor:pointer}
.leaderboard-row.clickable:hover{color:var(--main)}

/* ---------- 친구들 ---------- */
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.student-card{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);text-align:left;transition:border-color .15s,transform .15s}
.student-card:hover{border-color:var(--main);transform:translateY(-1px)}
.student-card .avatar{width:42px;height:42px;font-size:14px}
.student-info{display:flex;flex-direction:column;gap:1px;min-width:0}
.student-name{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:15px}
.student-status{margin-top:2px;color:var(--text-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#eef0f3;color:var(--text-2);font-size:12px;font-weight:800}
.rank-badge.rank-1{background:#fff3cd;color:#8a6d00}
.rank-badge.rank-2{background:#e9ecef;color:#495057}
.rank-badge.rank-3{background:#f3e0d0;color:#8a4b00}

.student-card{position:relative;overflow:hidden}
.student-card > *{position:relative;z-index:1}
.student-card[class*="border-"]{border:2px solid var(--frame);background:var(--tint);padding-right:36px}
.student-card[class*="border-"]:hover{border-color:var(--frame);box-shadow:0 4px 14px var(--glow)}
.student-card[class*="border-"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--cover);z-index:0}
.student-card[class*="border-"]::after{content:"";position:absolute;right:9px;top:9px;width:18px;height:18px;z-index:0;background:var(--frame);-webkit-mask:var(--deco) center/contain no-repeat;mask:var(--deco) center/contain no-repeat}
.student-card .avatar[class*="border-"]{background:var(--accent);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--frame)}
/* 카드 모양 */
.student-card.border-gold{border-style:double;border-width:4px;border-radius:6px}
.student-card.border-gradient{border:2px solid transparent;background:linear-gradient(135deg,#fbf3ff,#f2f6ff) padding-box,linear-gradient(90deg,#ff8ec7,#7c7bff,#7ef7bf,#ff8ec7) border-box;background-size:100% 100%,200% 100%;animation:pf-slide 4s linear infinite}
.student-card.border-vine{border-style:dashed;border-radius:20px 6px 20px 6px}
.student-card.border-branch{border-radius:6px}
.student-card.border-thorn{border-style:dotted;border-width:3px;border-radius:4px 18px 4px 18px}
.student-card.border-crystal{border-radius:0;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.student-card.border-ribbon{border-radius:22px 6px 22px 6px}
.student-card.border-lotus{border-radius:26px}
.student-card.border-wing{border-radius:30px 10px 30px 10px}
.student-card.border-spire{border-radius:3px}
.student-card.border-neon{background:linear-gradient(135deg,#071a26,#0c2a3a);color:#e6f9ff;animation:pf-glow 2.4s ease-in-out infinite}
.student-card.border-nova{background:radial-gradient(circle at 85% 20%,#3b2a8a,#1a1440 70%);color:#f1eeff}
.student-card.border-neon .meta,.student-card.border-neon .student-status,.student-card.border-nova .meta,.student-card.border-nova .student-status{color:rgba(240,245,255,.72)}
.student-card.border-spark::after{animation:pf-twinkle 1.6s ease-in-out infinite}
.student-card.border-lotus::after,.student-card.border-wing::after{animation:pf-float 2.8s ease-in-out infinite}
/* 아바타 모양 */
.avatar.border-thorn{border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);box-shadow:none}
.avatar.border-crystal{border-radius:0;clip-path:polygon(50% 0,100% 28%,100% 72%,50% 100%,0 72%,0 28%);box-shadow:none}
.avatar.border-gold,.avatar.border-branch,.avatar.border-spire{border-radius:12px}
.avatar.border-gradient{background:linear-gradient(135deg,#ff8ec7,#7c7bff,#7ef7bf)}
.avatar.border-neon{box-shadow:0 0 0 2px #071a26,0 0 0 4px #00d8ff,0 0 10px #00d8ff}
.avatar.border-nova{box-shadow:0 0 0 2px #1a1440,0 0 0 4px #b8b3ff,0 0 10px #7d63ff}
.profile-msg-del{margin-left:auto;min-height:26px;padding:0 8px;font-size:12px}
@media (prefers-reduced-motion:reduce){.student-card,.student-card::after{animation:none!important}}

/* ---------- 안내 띠 ---------- */
.notify-banner{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;border-radius:var(--radius);background:var(--light);color:var(--dark);font-size:14px}
.lock-banner{margin-bottom:16px;padding:12px 16px;border-radius:var(--radius);background:var(--danger-soft);color:#c62f35;font-size:14px;font-weight:600}
.feed-warning{margin-top:12px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--danger-soft);color:#c62f35;font-size:13px}

/* ---------- 게시판 ---------- */
.board{overflow:hidden}
.board-head,.board-row{display:grid;grid-template-columns:56px minmax(0,1fr) 130px 64px 52px 52px;align-items:center;gap:10px;padding:0 18px}
.board-head{height:42px;border-bottom:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-size:13px;font-weight:600}
.board-row{padding-top:13px;padding-bottom:13px;cursor:pointer;transition:background .12s}
.board-row + .board-row{border-top:1px solid var(--border)}
.board-row:hover{background:var(--surface-2)}
.c-no,.c-date,.c-num{text-align:center;color:var(--muted);font-size:13px}
.board-head .c-no,.board-head .c-date,.board-head .c-num{color:var(--text-2)}
.c-num.liked{color:var(--main);font-weight:700}
.c-title{display:flex;align-items:center;gap:6px;min-width:0}
.c-title-text{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-row:hover .c-title-text{color:var(--main)}
.c-author{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.comment-count{flex-shrink:0;color:var(--main);font-size:13px;font-weight:700}
.board-mobile-meta{display:none}
.board-tabs{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:#eceef1}
.board-tab{padding:6px 12px;border:0;border-radius:8px;background:none;color:var(--text-2);font-size:13px;font-weight:600}
.board-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.search-input{width:240px;max-width:100%}
.pagination{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:16px}
.page-btn{min-width:34px;height:34px;padding:0 8px;border:1px solid transparent;border-radius:8px;background:none;color:var(--text-2);font-size:14px}
.page-btn:hover{background:var(--surface)}
.page-btn.active{border-color:var(--border-strong);background:var(--surface);color:var(--text);font-weight:700}

.back-btn{margin:0 0 10px -10px}
.post{padding:28px 30px}
.post-title{margin:0 0 12px;font-size:24px;font-weight:800;word-break:break-word}
.post > .badge{margin-bottom:10px}
.post-meta{display:flex;align-items:center;gap:4px 12px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--border);color:var(--muted);font-size:13px}
.post-author{display:inline-flex;align-items:center;gap:4px;color:var(--text);font-size:14px}
.post-body{padding:22px 0 4px;font-size:16px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.post-like{display:flex;justify-content:center;margin:28px 0 4px}
.like-btn{display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:96px;padding:12px 18px;border:1px solid var(--border-strong);border-radius:16px;background:var(--surface);color:var(--text-2);font-size:13px;font-weight:600;transition:background .15s,border-color .15s,color .15s}
.like-icon{font-size:24px;line-height:1.1;filter:grayscale(1);opacity:.6;transition:filter .15s,opacity .15s}
.like-btn:hover{border-color:var(--main)}
.like-btn.active{border-color:var(--main);background:var(--light);color:var(--main)}
.like-btn.active .like-icon{filter:none;opacity:1}
.like-btn:disabled{opacity:.6;cursor:wait}
.post-actions{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.comments{margin-top:16px}
.comment-total{color:var(--main)}
.comment{padding:14px 0}
.comment + .comment{border-top:1px solid var(--border)}
.comment-head{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;font-size:14px}
.comment-body{margin-top:4px;white-space:pre-wrap;word-break:break-word}
.comment-del{margin-left:auto;padding:2px 6px;border:0;background:none;color:var(--muted);font-size:12px}
.comment-del:hover{color:var(--danger)}
.comment-form{display:flex;gap:8px;align-items:stretch;margin-top:12px;padding-top:16px;border-top:1px solid var(--border)}
.comment-form textarea{flex:1;min-height:46px;height:46px;resize:vertical}
.comment-form .primary{min-height:46px}

.feed-post-embed{max-width:480px;margin-top:12px}
.feed-post-embed img{display:block;max-width:100%;border:1px solid var(--border);border-radius:12px}
.feed-post-embed iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.video-placeholder{position:relative;max-width:480px;aspect-ratio:16/9;margin-top:12px;border-radius:12px;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
.video-placeholder img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
.video-placeholder button{position:relative;z-index:1;padding:9px 18px;border:0;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;font-weight:700}
.link-card{display:block;margin-top:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);color:var(--text-2);font-size:13px;text-decoration:none;word-break:break-all}
.link-card:hover{border-color:var(--border-strong)}
.link-card b{display:block;margin-bottom:2px;color:var(--main);font-size:13px}

/* ---------- 게임 ---------- */
.games-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.game-card{display:flex;flex-direction:column;padding:20px;transition:transform .15s,box-shadow .15s}
.game-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(16,24,40,.08)}
.game-icon{width:52px;height:52px;margin-bottom:14px;display:flex;justify-content:center;align-items:center;border-radius:14px;background:var(--surface-2);font-size:28px}
.game-card h3{margin:0 0 4px;font-size:16px}
.game-card p{flex:1;margin:0 0 16px;color:var(--text-2);font-size:14px}
.game-link{display:flex;align-items:center;justify-content:center;min-height:38px;border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);font-size:14px;font-weight:600;text-decoration:none}
.game-link:hover{background:var(--light);color:var(--main)}
.game-note{margin-bottom:16px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text-2);font-size:13px}

/* ---------- 계정 / 상점 ---------- */
.account-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.shop-section h4{margin:22px 0 10px;color:var(--text-2);font-size:14px}
.shop-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.shop-item{display:flex;flex-direction:column;align-items:center;padding:16px 12px;text-align:center;box-shadow:none}
.shop-item .icon{margin-bottom:6px;font-size:26px}
.shop-item .name{flex:1;margin-bottom:4px;font-size:13px;font-weight:700}
.shop-item .price{margin-bottom:10px;color:var(--warn);font-size:13px;font-weight:600}
.shop-item button{width:100%}
.shop-item.owned{background:var(--surface-2)}
.shop-more{grid-column:1/-1;text-align:center}
.nickname-color-input{width:100%;height:36px;margin-bottom:8px;padding:2px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface)}

/* ---------- 로딩 / 토스트 ---------- */
.spinner-row{padding:64px 20px;text-align:center;color:var(--muted);font-size:14px}
.spinner-row::before{content:"";display:block;width:26px;height:26px;margin:0 auto 12px;border:3px solid var(--border);border-top-color:var(--main);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#toastHost{position:fixed;left:50%;bottom:24px;z-index:10010;display:flex;flex-direction:column;align-items:center;gap:8px;width:calc(100% - 32px);max-width:420px;transform:translateX(-50%);pointer-events:none}
.toast{padding:12px 16px;border-radius:12px;background:#1f2937;color:#fff;font-size:14px;line-height:1.5;white-space:pre-line;box-shadow:var(--shadow-lg);pointer-events:auto;cursor:pointer;animation:toast-in .2s ease-out}
.toast.hide{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}}

/* ---------- 반응형 ---------- */
@media(max-width:860px){
  .home-grid{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(3,1fr)}
  .games-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:640px){
  .top{padding:10px 16px 2px}
  .user-badge{display:none}
  .nav-inner{padding:0 6px}
  main{margin-top:20px;padding:0 16px}
  .page-title h1,.home-hello h1{font-size:21px}
  .card{padding:16px}
  .list-item{gap:12px;padding:12px 14px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .games-grid{grid-template-columns:minmax(0,1fr)}
  .shop-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toolbar-right{flex-basis:100%}
  .search-input{flex:1;width:auto}
  .board-head{display:none}
  .board-row{grid-template-columns:minmax(0,1fr);gap:3px;padding:12px 16px}
  .board-row .c-no,.board-row .c-author,.board-row .c-date,.board-row .c-num{display:none}
  .board-mobile-meta{display:block;color:var(--muted);font-size:12px}
  .post{padding:20px 18px}
  .post-title{font-size:20px}
  .post-body{font-size:15px}
  .modal{padding:22px 18px}
  .calendar-grid{min-width:0}
  .day{min-height:60px;padding:4px 2px;text-align:center}
  .event{height:5px;margin:3px 2px 0;padding:0;font-size:0}
}
</style>
</head>

function ic(name,cls=""){
  if(!name) return "";
  if(name.startsWith("a:")) return animalArt(name.slice(2),cls);
  const d=ICON_PATHS[name]; if(!d) return "";
  return `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
}
function animalArt(kind,cls=""){
  const d=ANIMAL_ART[kind]; if(!d) return "";
  return `<svg class="ic-animal ${cls}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
}

   사이트 이모티콘: 글에 :cat: 처럼 쓰면 그림으로 바뀌어요
========================================================= */
const EMOTICONS=[
  ["cat","a:cat"],["puppy","a:puppy"],["fox","a:fox"],["tiger","a:tiger"],["panda","a:panda"],["rabbit","a:rabbit"],
  ["hamster","a:hamster"],["chick","a:chick"],["owl","a:owl"],["penguin","a:penguin"],["sloth","a:sloth"],
  ["heart","heart","#ef4565"],["star","star","#f5b800"],["fire","flame","#ff6a1f"],["sparkle","sparkle","#f0a800"],
  ["crown","crown","#e5a800"],["good","thumb","#3268e8"],["idea","bulb","#f0a800"],["ok","check-circle","#21a366"],
  ["trophy","trophy","#d9a529"],["moon","moon","#7d63ff"],["flower","flower","#ff7ea6"],["bolt","bolt","#00b4d8"],
  ["gem","gem","#5da7ff"],["leaf","leaf","#2ea95e"],["bell","bell","#ff9b2f"]
];
const EMOTICON_MAP=Object.fromEntries(EMOTICONS.map(([code,icon,color])=>[code,{icon,color}]));

function emoticonSvg(code){
  const e=EMOTICON_MAP[code]; if(!e) return "";
  if(e.icon.startsWith("a:")) return animalArt(e.icon.slice(2),"emo");
  return `<span class="emo emo-ic" style="color:${e.color}">${ic(e.icon)}</span>`;
}

// 이미 escapeHTML 된 글에서만 사용하세요. 이모티콘 하나만 있으면 크게 보여줘요.
function withEmoticons(escaped,big=false){
  const replaced=escaped.replace(/:([a-z]+):/g,(m,code)=>EMOTICON_MAP[code] ? emoticonSvg(code) : m);
  const only=/^\s*:([a-z]+):\s*$/.exec(escaped);
  return big && only && EMOTICON_MAP[only[1]] ? `<span class="emo-big">${replaced}</span>` : replaced;
}

function emoPicker(targetId){
  return `<span class="emo-picker">
    <button type="button" class="outline emo-toggle" title="이모티콘" aria-label="이모티콘" onclick="toggleEmoPicker(this)">${ic("smile")}</button>
    <span class="emo-pop">${EMOTICONS.map(([code])=>`<button type="button" title=":${code}:" onclick="insertEmoticon('${targetId}','${code}',this)">${emoticonSvg(code)}</button>`).join("")}</span>
  </span>`;
}

function toggleEmoPicker(btn){
  const wrap=btn.closest(".emo-picker");
  document.querySelectorAll(".emo-picker.open").forEach(w=>{ if(w!==wrap) w.classList.remove("open"); });
  wrap.classList.toggle("open");
}

function insertEmoticon(targetId,code,btn){
  const el=document.getElementById(targetId); if(!el) return;
  const text=`:${code}:`;
  const start=el.selectionStart ?? el.value.length, end=el.selectionEnd ?? el.value.length;
  el.value=el.value.slice(0,start)+text+el.value.slice(end);
  el.focus(); el.selectionStart=el.selectionEnd=start+text.length;
  btn.closest(".emo-picker")?.classList.remove("open");
}

// 글을 쓸 수 있는 모든 칸(textarea, 상태 메시지 등)에 이모티콘 버튼을 자동으로 붙여요
const EMO_INPUT_SELECTOR='textarea[id], input[id].input[type="text"]:not([data-no-emo]), input[id="profileMsgInput"]';
function attachEmoPickers(root=document){
  root.querySelectorAll?.(EMO_INPUT_SELECTOR).forEach(el=>{
    if(el.dataset.emo==="1" || el.readOnly || el.disabled) return;
    if(el.closest(".login-box")) return;
    el.dataset.emo="1";
    const tmp=document.createElement("div");
    tmp.innerHTML=emoPicker(el.id).trim();
    const picker=tmp.firstElementChild;
    const parent=el.parentElement;
    if(parent && (parent.classList.contains("comment-form") || parent.classList.contains("inline-form"))){
      el.after(picker);
    }else{
      const row=document.createElement("div");
      row.className="emo-row";
      row.append(picker);
      el.after(row);
    }
  });
}
new MutationObserver(muts=>{
  for(const m of muts) m.addedNodes.forEach(n=>{ if(n.nodeType===1) attachEmoPickers(n.parentElement||n); });
}).observe(document.body,{childList:true,subtree:true});
attachEmoPickers();

document.addEventListener("click",e=>{
  if(!e.target.closest(".emo-picker")) document.querySelectorAll(".emo-picker.open").forEach(w=>w.classList.remove("open"));
});

function titleHtml(t){
  if(!t) return "";
  const kind=TITLE_EMOJI_TO_ANIMAL[t];
  return kind ? animalArt(kind,"title-animal") : escapeHTML(t);
}

function cleanNormalize(text,{leet=false}={}){
  const src=String(text||"").normalize("NFC").replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  let out="", map=[];
  for(let i=0;i<src.length;i++){
    let c=src[i].toLowerCase();
    if(leet && LEET[c]) c=LEET[c];
    if(/[가-힣ㄱ-ㅎㅏ-ㅣa-z]/.test(c)){ out+=c; map.push(i); }
  }
  return {src,out,map};
}

function blankAllowed(out){
  let s=out;
  CLEAN_ALLOW_KO.forEach(a=>{ if(a) s=s.split(a).join("\u0000".repeat(a.length)); });
  return s;
}

// 원래 글에서 걸린 부분의 위치들을 찾아요 [{start,end}]
function findBadSpans(text){
  if(!text) return [];
  const spans=[];
  const add=(n,from,to)=>{ if(to>from) spans.push({start:n.map[from],end:n.map[to-1]+1}); };

  // 한국어 + 추가 단어 (띄어쓰기/기호 무시)
  const n=cleanNormalize(text);
  const hay=blankAllowed(n.out);
  BAD_PATTERNS_KO.forEach(re=>{
    const g=new RegExp(re.source,"g"); let m;
    while((m=g.exec(hay))){ add(n,m.index,m.index+m[0].length); if(!m[0].length) g.lastIndex++; }
  });
  BLOCKED_EXTRA.forEach(w=>{ let i=-1; while((i=n.out.indexOf(w,i+1))>=0) add(n,i,i+w.length); });

  // 영어: 숫자/기호 바꿔치기(sh1t, f@ck)까지 되돌려서 검사
  const nl=cleanNormalize(text,{leet:true});
  BAD_WORDS_EN_ANY.forEach(w=>{ let i=-1; while((i=nl.out.indexOf(w,i+1))>=0) add(nl,i,i+w.length); });
  // 단어 단위: 원래 글을 단어로 나눠서 비교
  const src=n.src; const wordRe=/[a-zA-Z0-9@$!|]+(?:[.\-_*][a-zA-Z0-9@$!|]+)*/g; let m;
  while((m=wordRe.exec(src))){
    const word=m[0].toLowerCase().replace(/[.\-_*]/g,"").replace(/./g,c=>LEET[c]||c);
    if(BAD_WORDS_EN_WHOLE.includes(word)) spans.push({start:m.index,end:m.index+m[0].length});
  }
  return spans;
}

// 방어코드: 혹시 문제가 생겨도 사이트 전체가 멈추지 않게
function containsBadWord(text){
  try{ return findBadSpans(text).length>0; }catch(e){ console.error(e); return false; }
}

function maskBadWords(text){
  try{
    const spans=findBadSpans(text); if(!spans.length) return text;
    const src=String(text).normalize("NFC").replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)); const chars=[...src.split("")];
    spans.forEach(({start,end})=>{ for(let i=start;i<end;i++) if(!/\s/.test(chars[i])) chars[i]="*"; });
    return chars.join("");
  }catch(e){ console.error(e); return text; }
}

// 부적절한 표현이 있으면 확인창을 띄우고, 진행하면 가린 글을 돌려줘요. 취소하면 null.
function cleanBotCheck(...texts){
  const count=texts.reduce((n,t)=>n+findBadSpansSafe(t).length,0);
  if(count>0){
    if(!confirm(`클린봇이 부적절한 표현 ${count}곳을 감지했습니다.\n해당 부분이 자동으로 *** 처리되어 등록됩니다.\n\n(잘못 감지됐다면 취소 후 표현을 바꿔주세요)`)){
      return null;
    }
  }
  return texts.map(t=>maskBadWords(t||""));
}
function findBadSpansSafe(t){ try{ return findBadSpans(t||""); }catch(e){ return []; } }

/* =========================================================
   NEIS 급식 / 시간표
   ⚠️ 인증키(apiKey)가 없으면 NEIS가 최대 5건만 돌려줘서 시간표가
   5교시까지만 나옵니다. https://open.neis.go.kr 에서 무료로 발급받아
   apiKey에 넣어주세요.
========================================================= */

const NEIS_CONFIG={
  atptOfcdcScCode:"J10",   // 경기도교육청
  sdSchulCode:"7681004",   // 교하중학교
  grade:"1",
  classNm:"3",
  apiKey:"19dcaeebced442a5b3dee40f49226e43"
};
const NEIS_CACHE_KEY="neis_cache_v2";
const NEIS_CACHE_LIMIT=30;

const ALLERGY_NAMES={
  1:"난류",2:"우유",3:"메밀",4:"땅콩",5:"대두",6:"밀",7:"고등어",8:"게",9:"새우",10:"돼지고기",
  11:"복숭아",12:"토마토",13:"아황산류",14:"호두",15:"닭고기",16:"쇠고기",17:"오징어",18:"조개류",19:"잣"
};

const neisMemoryCache=new Map();
let mealDate=today();
let timetableDate=today();

// 예전 버전이 남긴 localStorage 값 정리
["neis_school_config_v1","neis_meal_cache_v1","neis_timetable_cache_v1"].forEach(key=>{
  try{ localStorage.removeItem(key); }catch(e){}
});

async function neisRequest(service,params){
  const query=new URLSearchParams({
    Type:"json", pSize:"100",
    ATPT_OFCDC_SC_CODE:NEIS_CONFIG.atptOfcdcScCode,
    SD_SCHUL_CODE:NEIS_CONFIG.sdSchulCode,
    ...params
  });
  if(NEIS_CONFIG.apiKey) query.set("KEY",NEIS_CONFIG.apiKey);

  const response=await fetch(`https://open.neis.go.kr/hub/${service}?${query}`);
  if(!response.ok) throw new Error(`NEIS ${service} 호출 실패 (${response.status})`);
  const json=await response.json();
  // 데이터가 없거나 오류면 {RESULT:{CODE,MESSAGE}}만 옵니다.
  if(json.RESULT){
    if(json.RESULT.CODE==="INFO-200") return [];
    throw new Error(json.RESULT.MESSAGE);
  }
  return json[service]?.[1]?.row || [];
}

// 날짜별로 메모리 + localStorage에 저장. 실패하면 같은 날짜의 저장본만 사용합니다.
async function loadNeisDay(kind,dateStr,loader){
  const cacheKey=`${kind}:${dateStr}`;
  if(neisMemoryCache.has(cacheKey)) return neisMemoryCache.get(cacheKey);

  let stored={};
  try{ stored=JSON.parse(localStorage.getItem(NEIS_CACHE_KEY)||"{}") || {}; }catch(e){}

  try{
    const result={date:dateStr, data:await loader(dateStr.replace(/-/g,""))};
    neisMemoryCache.set(cacheKey,result);

    delete stored[cacheKey];
    stored[cacheKey]=result.data;
    const keys=Object.keys(stored);
    keys.slice(0,Math.max(0,keys.length-NEIS_CACHE_LIMIT)).forEach(key=>delete stored[key]);
    try{ localStorage.setItem(NEIS_CACHE_KEY,JSON.stringify(stored)); }catch(e){}

    return result;
  }catch(e){
    console.warn(`NEIS ${kind} 불러오기 실패`,e);
    if(stored[cacheKey]) return {date:dateStr, data:stored[cacheKey], offline:true};
    return {date:dateStr, data:null, error:true};
  }
}

function splitNeisLines(text){
  return String(text||"").split(/<br\s*\/?>/i).map(s=>s.trim()).filter(Boolean);
}

// "목살스테이크*소스 (1.2.5.6)" → 메뉴 이름과 알레르기 번호 분리
function parseDish(text){
  const match=text.match(/^(.*?)\s*\(([\d.\s]+)\)\s*$/);
  if(!match) return {name:text, allergies:[]};
  return {name:match[1].trim(), allergies:match[2].split(".").map(s=>s.trim()).filter(Boolean)};
}

function fetchMeals(dateStr){
  return loadNeisDay("meal",dateStr,async ymd=>{
    const rows=await neisRequest("mealServiceDietInfo",{MLSV_YMD:ymd});
    return rows.map(row=>({
      type:row.MMEAL_SC_NM || "급식",
      calories:row.CAL_INFO || "",
      dishes:splitNeisLines(row.DDISH_NM).map(parseDish)
    }));
  });
}

function fetchTimetable(dateStr){
  return loadNeisDay("timetable",dateStr,async ymd=>{
    const rows=await neisRequest("misTimetable",{
      ALL_TI_YMD:ymd, GRADE:NEIS_CONFIG.grade, CLASS_NM:NEIS_CONFIG.classNm
    });
    const byPeriod=new Map();
    rows.forEach(row=>{
      const period=Number(row.PERIO);
      const subject=String(row.ITRT_CNTNT||"").replace(/^[-*\s]+/,"").trim();
      if(period && subject && !byPeriod.has(period)) byPeriod.set(period,subject);
    });
    return [...byPeriod].sort((a,b)=>a[0]-b[0]).map(([period,subject])=>({period,subject}));
  });
}

// 주말은 건너뛰고 n일 이동
function shiftSchoolDay(dateStr,n){
  const d=new Date(`${dateStr}T00:00:00`);
  do{ d.setDate(d.getDate()+n); }while(d.getDay()===0 || d.getDay()===6);
  return formatDate(d);
}

function schoolDateLabel(dateStr){
  const d=new Date(`${dateStr}T00:00:00`);
  const label=`${d.getMonth()+1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`;
  return dateStr===today() ? `오늘 · ${label}` : label;
}

function neisCardHeader(title,changeFn,dateStr){
  return `
    <div class="toolbar">
      <h3 style="margin:0">${title}</h3>
      <div class="date-nav">
        <button class="outline" onclick="${changeFn}(-1)" aria-label="이전 날">◀</button>
        <strong>${escapeHTML(schoolDateLabel(dateStr))}</strong>
        <button class="outline" onclick="${changeFn}(1)" aria-label="다음 날">▶</button>
        ${dateStr!==today() ? `<button class="outline" onclick="${changeFn}(0)">오늘</button>` : ""}
      </div>
    </div>
  `;
}

function neisStatusMessage(result,what){
  if(result.loading) return `<p class="meta">불러오는 중...</p>`;
  if(result.error) return `<p class="meta">${what} 정보를 불러오지 못했어요. 잠시 후 다시 시도해주세요.</p>`;
  if(!result.data.length) return `<p class="meta">이 날은 ${what} 정보가 없어요. (주말·공휴일·방학일 수 있어요)</p>`;
  return "";
}

function renderTimetableCard(result){
  const status=neisStatusMessage(result,"시간표");
  const periods=result.data || [];
  return `
    ${neisCardHeader(ic("clock")+" 시간표","changeTimetableDate",result.date)}
    ${result.offline ? `<p class="meta">${ic("alert")} 연결이 안 돼서 저장해 둔 시간표를 보여주고 있어요.</p>` : ""}
    ${status || periods.map(item=>`
      <div class="timetable-row">
        <span class="badge">${item.period}교시</span>
        <span>${escapeHTML(item.subject)}</span>
      </div>
    `).join("")}
    ${!status && !NEIS_CONFIG.apiKey && periods.length>=5
      ? `<p class="meta">※ NEIS 인증키가 없어 5교시까지만 표시될 수 있어요.</p>` : ""}
  `;
}

function renderMealCard(result){
  const status=neisStatusMessage(result,"급식");
  return `
    ${neisCardHeader(ic("bowl")+" 급식","changeMealDate",result.date)}
    ${result.offline ? `<p class="meta">${ic("alert")} 연결이 안 돼서 저장해 둔 급식을 보여주고 있어요.</p>` : ""}
    ${status || result.data.map(meal=>`
      <div class="meal-block">
        <div class="meta">${escapeHTML(meal.type)}${meal.calories ? ` · ${escapeHTML(meal.calories)}` : ""}</div>
        <ul class="meal-list">
          ${meal.dishes.map(dish=>`
            <li>
              ${escapeHTML(dish.name)}
              ${dish.allergies.length
                ? `<span class="allergy">${escapeHTML(dish.allergies.map(n=>ALLERGY_NAMES[n]||n).join("·"))}</span>` : ""}
            </li>
          `).join("")}
        </ul>
      </div>
    `).join("")}
  `;
}

async function fillNeisCard(cardId,dateStr,fetcher,renderer){
  const card=document.getElementById(cardId);
  if(!card) return;
  card.dataset.date=dateStr;
  card.innerHTML=renderer({date:dateStr, loading:true});

  const result=await fetcher(dateStr);
  // 불러오는 사이 날짜를 바꿨거나 다른 페이지로 갔으면 무시
  const current=document.getElementById(cardId);
  if(current && current.dataset.date===dateStr) current.innerHTML=renderer(result);
}

function changeTimetableDate(n){
  timetableDate=n===0 ? today() : shiftSchoolDay(timetableDate,n);
  fillNeisCard("timetableCard",timetableDate,fetchTimetable,renderTimetableCard);
}

function changeMealDate(n){
  mealDate=n===0 ? today() : shiftSchoolDay(mealDate,n);
  fillNeisCard("mealCard",mealDate,fetchMeals,renderMealCard);
}

   공통 HELPERS
========================================================= */

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function formatDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function today(){ return formatDate(new Date()); }

// alert 대신 화면 아래에 잠깐 떴다 사라지는 메시지 (누르면 바로 닫힘)
function msg(text){
  const host=document.getElementById("toastHost");
  if(!host){ alert(text); return; }
  const toast=document.createElement("div");
  toast.className="toast";
  toast.textContent=text;
  toast.onclick=()=>toast.remove();
  host.appendChild(toast);
  const duration=Math.min(8000,2600+String(text).length*40);
  setTimeout(()=>toast.classList.add("hide"),duration);
  setTimeout(()=>toast.remove(),duration+400);
}

function isEditedRecord(row){
  if(!row) return false;
  const created=row.created_at;
  const updated=row.updated_at || row.edited_at;
  if(!created || !updated) return false;
  return new Date(updated).getTime() !== new Date(created).getTime();
}

// DB 시각(UTC)을 한국 시간으로 바꿔서 표시
function parseDate(value){
  const d=new Date(value);
  return Number.isNaN(d.getTime()) ? null : d;
}

function fmtDay(value){
  const d=parseDate(value);
  return d ? formatDate(d) : String(value||"").slice(0,10);
}

function fmtDateTime(value){
  const d=parseDate(value);
  if(!d) return String(value||"").slice(0,16).replace("T"," ");
  return `${formatDate(d)} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

// 게시판 목록용: 오늘 쓴 글은 시각, 그 외는 월.일
function shortDate(value){
  const d=parseDate(value);
  if(!d) return "";
  if(formatDate(d)===today()) return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  return `${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
}

function formatMetaTimestamp(row){
  if(!row?.created_at) return "";
  const stamp=fmtDateTime(row.created_at);
  return isEditedRecord(row) ? `${stamp} (수정됨)` : stamp;
}

function applyEquippedStyles(){

  const fontItem=FONT_ITEMS.find(f=>f.id===profile?.equipped_font);

}

function daysUntil(dateStr){
  const target=new Date(dateStr+"T00:00:00");
  const now=new Date();
  now.setHours(0,0,0,0);
  return Math.ceil((target-now)/(1000*60*60*24));
}

function ddayLabel(diff){
  if(diff===0) return "D-DAY";
  if(diff>0) return `D-${diff}`;
  return `D+${Math.abs(diff)}`;
}

function ddayBadge(dateStr){
  const diff=daysUntil(dateStr);
  if(diff<0) return `<span class="badge badge-muted">지남</span>`;
  return `<span class="badge ${diff<=3?"badge-danger":"badge-accent"}">${ddayLabel(diff)}</span>`;
}

// 목록 왼쪽에 붙는 날짜 칸 (10월 / 29 / 목)
function dateTile(dateStr){
  const d=new Date(`${dateStr}T00:00:00`);
  return `
    <div class="date-tile">
      <span class="m">${d.getMonth()+1}월</span>
      <span class="d">${d.getDate()}</span>
      <span class="w">${"일월화수목금토"[d.getDay()]}</span>
    </div>
  `;
}

/* =========================================================
   앱 전역 설정 (SNS 잠금 등)
   ⚠️ supabase에 "app_settings" 테이블(id int8, sns_locked bool)이
   필요하며, id=1 행이 하나 있어야 합니다. 관리자만 UPDATE 가능하도록
   RLS를 설정해주세요. 테이블이 없으면 잠금 기능은 항상 꺼짐 상태로 동작합니다.

   토글이 반응하지 않을 때 체크할 것:
   1) app_settings 테이블/컬럼(id int8, sns_locked bool)이 실제로 있는지
   2) id=1 행이 미리 한 줄 들어있는지 (없으면 upsert가 실패할 수 있음)
   3) profiles.role 값이 정확히 'admin' 문자열인지 (공백/오타 확인)
   4) admin이 app_settings를 UPDATE/INSERT 할 수 있도록 RLS 정책이
      설정되어 있는지 (SELECT만 허용되어 있으면 버튼을 눌러도 반영되지 않음)
========================================================= */

async function loadSettings(){
  const {data,error}=await supabase.from("app_settings").select("*").eq("id",1).maybeSingle();
  if(error){ console.warn("app_settings 로드 실패 (테이블/RLS 확인 필요):",error); }
  if(error || !data){ appSettings={sns_locked:false}; return; }
  appSettings=data;
}

async function toggleSnsLock(){
  if(!profile || profile.role!=="admin")return;
  const next=!appSettings.sns_locked;
  if(!confirm(next ? "게시판을 잠글까요? 학생들이 글쓰기와 댓글을 할 수 없게 됩니다." : "게시판 잠금을 풀까요?"))return;

  const {error}=await supabase.from("app_settings").upsert({id:1,sns_locked:next});
  if(error){
    console.error("SNS 잠금 변경 실패:",error);
    msg("설정 변경 실패: "+error.message+"\n(app_settings 테이블/RLS 정책을 확인해주세요. 콘솔에 자세한 오류가 출력되었습니다.)");
    return;
  }

  // 반영이 제대로 됐는지 서버에서 다시 확인 (RLS로 인해 조용히 실패하는 경우 방지)
  await loadSettings();
  if(appSettings.sns_locked!==next){
    msg("설정이 저장되지 않은 것 같습니다. 관리자 권한/RLS 정책을 확인해주세요.");
    return;
  }

  renderUserInfo();

  const activeBtn=document.querySelector('.nav-btn.active');
  if(activeBtn && activeBtn.dataset.page==="feed") renderFeed();
}

/* =========================================================
   📅 시험/수행평가 임박 알림
   - 브라우저 Notification API 사용 (탭/앱이 열려있을 때 동작)
   - 완전한 백그라운드 푸시(앱을 꺼도 오는 알림)를 원한다면
     Service Worker + Push API + 서버(Edge Function 등)의 예약 발송이
     추가로 필요합니다. 이 함수는 로그인 시점에 다가오는 시험을
     체크해서 로컬 알림을 띄워주는 "1차" 기능입니다.
========================================================= */

function getNotifiedDates(){
  try{
    return JSON.parse(localStorage.getItem(EXAM_NOTIFY_STORAGE_KEY)||"[]");
  }catch(e){
    return [];
  }
}

function markNotified(keys){
  try{
    const existing=getNotifiedDates();
    localStorage.setItem(EXAM_NOTIFY_STORAGE_KEY,JSON.stringify([...new Set([...existing,...keys])]));
  }catch(e){ /* localStorage 사용 불가 시 무시 */ }
}

function getNotificationPermissionState(){
  if(typeof window==="undefined" || !("Notification" in window)) return "unsupported";
  return Notification.permission;
}

/* =========================================================
   🔔 백그라운드 푸시 (사이트를 꺼도 오는 알림)
   서버가 필요해서 push-setup.md 순서대로 설정해야 합니다.
   VAPID_PUBLIC_KEY가 비어 있으면 이 기능은 꺼지고, 예전처럼
   사이트를 열어둔 동안만 알림이 옵니다.
========================================================= */

const VAPID_PUBLIC_KEY="";

function urlBase64ToUint8Array(base64){
  const padded=(base64+"=".repeat((4-base64.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/");
  return Uint8Array.from(atob(padded),c=>c.charCodeAt(0));
}

function isIosBrowserTab(){
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  const standalone=window.navigator.standalone===true || window.matchMedia("(display-mode: standalone)").matches;
  return ios && !standalone;
}

async function currentPushSubscription(){
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    return reg ? await reg.pushManager.getSubscription() : null;
  }catch(e){ return null; }
}

// "unconfigured" | "unsupported" | "needs-install" | "denied" | "on" | "off"
async function getPushState(){
  if(!VAPID_PUBLIC_KEY) return "unconfigured";
  if(isIosBrowserTab()) return "needs-install";
  if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return "unsupported";
  if(Notification.permission==="denied") return "denied";
  return (await currentPushSubscription()) ? "on" : "off";
}

function refreshNotifyUI(){
  if(["home","account"].includes(activePage())) render(activePage());
}

async function enablePush(){
  const state=await getPushState();
  if(state==="unconfigured"){ await initExamNotifications(); refreshNotifyUI(); return; }
  if(state==="needs-install"){ msg("아이폰은 사파리 공유 버튼 → '홈 화면에 추가'로 설치한 뒤, 설치된 앱에서 켜주세요."); return; }
  if(state==="unsupported"){ msg("이 브라우저는 백그라운드 알림을 지원하지 않아요."); return; }

  const permission=Notification.permission==="granted" ? "granted" : await Notification.requestPermission();
  if(permission!=="granted"){
    msg("알림이 허용되지 않았어요. 브라우저 설정에서 이 사이트의 알림을 허용해주세요.");
    refreshNotifyUI();
    return;
  }

  try{
    const reg=await Promise.race([
      navigator.serviceWorker.ready,
      new Promise((_,reject)=>setTimeout(()=>reject(new Error("서비스 워커가 준비되지 않았어요. 사이트가 https 주소인지 확인해주세요.")),6000))
    ]);
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
    }
    const json=sub.toJSON();
    const {error}=await supabase.from("push_subscriptions").upsert(
      {endpoint:json.endpoint, user_id:currentUser.id, p256dh:json.keys.p256dh, auth:json.keys.auth},
      {onConflict:"endpoint"}
    );
    if(error) throw error;
    msg("이제 사이트를 꺼도 시험·수행평가 알림이 와요!");
  }catch(e){
    console.error(e);
    msg("알림을 켜지 못했어요: "+(e.message||e));
  }
  refreshNotifyUI();
}

async function disablePush(){
  try{
    const sub=await currentPushSubscription();
    if(sub){
      await supabase.from("push_subscriptions").delete().eq("endpoint",sub.endpoint);
      await sub.unsubscribe();
    }
    msg("백그라운드 알림을 껐어요.");
  }catch(e){
    console.error(e);
    msg("알림을 끄지 못했어요: "+(e.message||e));
  }
  refreshNotifyUI();
}

async function initExamNotifications(){
  if(!("Notification" in window))return;

  // 백그라운드 푸시를 켠 기기는 서버가 알려주므로, 여기서 또 띄우면 중복됩니다
  if((await getPushState())==="on") return;

  const before=Notification.permission;
  if(before==="default"){
    try{ await Notification.requestPermission(); }catch(e){ /* 무시 */ }
  }

  // 권한 상태가 바뀌었으면 알림 안내가 보이는 페이지만 새로 그림
  // (예전엔 여기서 무조건 계정 페이지를 그려서, 로그인하면 홈 대신 계정 페이지가 떴음)
  if(Notification.permission!==before && ["home","account"].includes(activePage())){
    render(activePage());
  }

  if(Notification.permission!=="granted")return;

  const in3days=new Date();
  in3days.setDate(in3days.getDate()+EXAM_NOTIFY_DAYS);
  const untilStr=`${in3days.getFullYear()}-${String(in3days.getMonth()+1).padStart(2,"0")}-${String(in3days.getDate()).padStart(2,"0")}`;

  const {data,error}=await supabase
    .from("assignments")
    .select("*")
    .gte("event_date",today())
    .lte("event_date",untilStr);

  if(error || !data || !data.length)return;

  const notifiedDates=getNotifiedDates();
  const newlyNotified=[];

  data.forEach(a=>{
    const key=`${a.id}-${a.event_date}`;
    if(notifiedDates.includes(key))return;

    const diff=daysUntil(a.event_date);
    try{
      new Notification(`수행평가/시험 임박: ${a.subject}`,{
        body:`${a.title} · ${ddayLabel(diff)} (${a.event_date})`,
        tag:key
      });
    }catch(e){ /* 알림 생성 실패 시 무시 */ }

    newlyNotified.push(key);
  });

  if(newlyNotified.length) markNotified(newlyNotified);
}

async function renderCalendar(){
  showLoading();
  const y=calendarDate.getFullYear();
  const m=calendarDate.getMonth();
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  const mm=String(m+1).padStart(2,"0");
  const start=`${y}-${mm}-01`;
  const end=`${y}-${mm}-${String(last.getDate()).padStart(2,"0")}`;

  const [schedulesResult,assignmentsResult]=await Promise.all([
    supabase.from("schedules").select("*").gte("event_date",start).lte("event_date",end),
    supabase.from("assignments").select("*").gte("event_date",start).lte("event_date",end)
  ]);
  const schedules=schedulesResult.data||[];
  const assignments=assignmentsResult.data||[];
  const todayStr=today();

  let cells="";
  for(let i=0;i<first.getDay();i++) cells+=`<div class="day empty-day"></div>`;

  for(let d=1;d<=last.getDate();d++){
    const date=`${y}-${mm}-${String(d).padStart(2,"0")}`;
    const weekday=new Date(y,m,d).getDay();
    const dayClass=`${date===todayStr?"today":""} ${weekday===0?"sun":weekday===6?"sat":""}`;
    cells+=`
      <div class="day ${dayClass}">
        <span class="day-num">${d}</span>
        ${schedules.filter(x=>x.event_date===date).map(e=>`<div class="event" title="${escapeHTML(e.title)}">${withEmoticons(escapeHTML(e.title))}</div>`).join("")}
        ${assignments.filter(x=>x.event_date===date).map(e=>`<div class="event assignment" title="${escapeHTML(`${e.subject} · ${e.title}`)}">${escapeHTML(e.subject)} · ${withEmoticons(escapeHTML(e.title))}</div>`).join("")}
      </div>
    `;
  }

  // 마지막 주를 빈 칸으로 채워서 달력 모양을 맞춤
  for(let i=first.getDay()+last.getDate();i%7!==0;i++) cells+=`<div class="day empty-day"></div>`;

  const monthEvents=[
    ...schedules.map(s=>({...s,label:s.title,kind:"일정"})),
    ...assignments.map(a=>({...a,label:`[${a.subject}] ${a.title}`,kind:"수행평가"}))
  ].sort((a,b)=>a.event_date.localeCompare(b.event_date));

  document.getElementById("app").innerHTML=`
    <div class="page-title"><h1>캘린더</h1><p>일정과 수행평가를 달력으로 한눈에 확인하세요.</p></div>
    <div class="calendar">
      <div class="calendar-head">
        <button class="outline btn-sm" onclick="changeMonth(-1)" aria-label="이전 달">‹</button>
        <b>${y}년 ${m+1}월</b>
        <button class="outline btn-sm" onclick="changeMonth(1)" aria-label="다음 달">›</button>
      </div>
      <div class="calendar-scroll">
        <div class="calendar-grid">
          ${["일","월","화","수","목","금","토"].map((x,i)=>`<div class="day-head ${i===0?"sun":i===6?"sat":""}">${x}</div>`).join("")}
          ${cells}
        </div>
      </div>
      <div class="calendar-legend"><span><i class="dot"></i>일정</span><span><i class="dot assignment"></i>수행평가</span></div>
    </div>

    <h3 class="sub-heading">${m+1}월 일정 목록</h3>
    <div class="list">
      ${monthEvents.length ? monthEvents.map(e=>`
        <div class="list-item">
          ${dateTile(e.event_date)}
          <div class="list-main">
            <div class="list-title">${escapeHTML(e.label)}</div>
            ${e.content ? `<div class="list-desc">${withEmoticons(escapeHTML(e.content))}</div>` : ""}
          </div>
          <span class="badge ${e.kind==="일정"?"badge-accent":"badge-warn"}">${e.kind}</span>
        </div>
      `).join("") : `<div class="list-empty">이번 달에는 등록된 일정이 없어요.</div>`}
    </div>
  `;
}

function changeMonth(n){ calendarDate.setMonth(calendarDate.getMonth()+n); renderCalendar(); }
