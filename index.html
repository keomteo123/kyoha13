async function renderVotes(){
  showLoading();
  const {data,error}=await supabase.from("votes").select(`*, profiles(nickname,handle), vote_options(*)`).order("created_at",{ascending:false});
  if(error){ showError(error.message); return; }

  const voteIds=data.map(v=>v.id);
  let responses=[];
  if(voteIds.length){
    const result=await supabase.from("vote_responses").select("vote_id,option_id,user_id").in("vote_id",voteIds);
    if(result.error){ showError(result.error.message); return; }
    responses=result.data||[];
  }

  document.getElementById("app").innerHTML=`
    <div class="page-title"><h1>투표</h1><p>우리 반의 의견을 함께 정해요.</p></div>
    ${isStaff() ? `
      <div class="toolbar">
        <span class="toolbar-count">관리자와 선생님만 투표를 만들 수 있어요.</span>
        <button class="primary" onclick="voteForm()">+ 투표 만들기</button>
      </div>` : ""}
    ${data.length ? data.map(v=>renderVoteCard(v,responses)).join("") : `<div class="card list-empty">등록된 투표가 없습니다.</div>`}
  `;
}

function sortedVoteOptions(v){
  return [...(v.vote_options||[])].sort((a,b)=>a.id-b.id);
}

function renderVoteCard(v,responses){
  const myVote=responses.find(r=>r.vote_id===v.id && r.user_id===currentUser.id);
  const total=responses.filter(r=>r.vote_id===v.id).length;
  const expired=v.expires_at && new Date(v.expires_at)<new Date();
  const active=v.is_active!==false && !expired;
  const showResults=Boolean(myVote)||!active;

  return `
    <div class="poll">
      <div class="poll-head">
        <div>
          <h3>${withEmoticons(escapeHTML(v.title))}</h3>
          <div class="meta">${authorLabel(v.profiles,v.author_id)} · ${total}명 참여${v.expires_at ? ` · 마감 ${fmtDateTime(v.expires_at)}` : ""}</div>
        </div>
        ${active ? `<span class="badge badge-accent">진행중</span>` : `<span class="badge badge-muted">종료</span>`}
      </div>
      ${v.description ? `<p class="poll-desc">${withEmoticons(escapeHTML(v.description))}</p>` : ""}
      ${active && !myVote ? `
        <div class="poll-options">
          ${sortedVoteOptions(v).map(o=>`
            <button class="poll-option" onclick="vote(${v.id},${o.id})">${withEmoticons(escapeHTML(o.option_text))}</button>
          `).join("")}
        </div>` : ""}
      ${myVote ? `<p class="poll-done">✓ 투표에 참여했어요</p>` : ""}
      ${showResults ? renderVoteResults(v,responses,total,myVote) : ""}
      ${isStaff() ? `<div class="poll-admin"><button class="danger btn-sm" onclick="deleteVote(${v.id})">투표 삭제</button></div>` : ""}
    </div>
  `;
}

function renderVoteResults(v,responses,total,myVote){
  return `
    <div class="vote-result">
      ${total===0 ? `<p class="meta" style="margin:0 0 10px">아직 참여한 사람이 없어요.</p>` : ""}
      ${sortedVoteOptions(v).map(o=>{
        const count=responses.filter(r=>r.vote_id===v.id && r.option_id===o.id).length;
        const percent=total ? Math.round(count/total*100) : 0;
        const mine=myVote?.option_id===o.id;
        return `
          <div class="vote-row ${mine?"mine":""}">
            <div class="vote-row-head"><span>${withEmoticons(escapeHTML(o.option_text))}${mine?" ✓":""}</span><span>${count}표 · ${percent}%</span></div>
            <div class="vote-bar"><div class="vote-bar-inner" style="width:${percent}%"></div></div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function voteForm(){
  if(!isStaff()){ msg("관리자 또는 선생님만 투표를 만들 수 있습니다."); return; }
  openModal(`
    <h2>${ic("vote")} 투표 만들기</h2>
    <div class="form-group"><label>질문</label><input id="vTitle" placeholder="예: 다음 학급 행사는 어디로 갈까요?"></div>
    <div class="form-group"><label>설명</label><textarea id="vDescription" style="min-height:90px" placeholder="투표에 대한 설명 (선택)"></textarea></div>
    <div class="form-group">
      <label>선택지</label>
      <div class="vote-option-inputs">
        <input id="v1" placeholder="선택지 1">
        <input id="v2" placeholder="선택지 2">
        <input id="v3" placeholder="선택지 3 (선택)">
        <input id="v4" placeholder="선택지 4 (선택)">
      </div>
    </div>
    <div class="form-group">
      <label>마감일시</label>
      <input id="vExpires" type="datetime-local">
      <div class="meta" style="margin-top:4px">비워두면 마감일이 없습니다.</div>
    </div>
    <div class="btn-row end"><button class="primary" onclick="createVote()">투표 만들기</button></div>
  `);
}

async function createVote(){
  if(!isStaff())return;
  const titleRaw=document.getElementById("vTitle").value.trim();
  const descriptionRaw=document.getElementById("vDescription").value.trim();
  const optionsRaw=["v1","v2","v3","v4"].map(id=>document.getElementById(id).value.trim()).filter(Boolean);
  const expiresInput=document.getElementById("vExpires").value;
  if(!titleRaw||optionsRaw.length<2){ msg("질문과 선택지 2개 이상을 입력해주세요."); return; }

  const cleaned=cleanBotCheck(titleRaw,descriptionRaw,...optionsRaw);
  if(!cleaned)return;
  const [title,description,...options]=cleaned;

  const expires_at=expiresInput ? new Date(expiresInput).toISOString() : null;

  const {data:voteRow,error}=await supabase.from("votes").insert({title,description,author_id:currentUser.id,expires_at}).select().single();
  if(error){ msg("투표 생성 실패:\n"+error.message); return; }

  const {error:optionError}=await supabase.from("vote_options").insert(options.map(option_text=>({vote_id:voteRow.id,option_text})));
  if(optionError){
    await supabase.from("votes").delete().eq("id",voteRow.id);
    msg("선택지 등록 실패:\n"+optionError.message);
    return;
  }
  closeModal(); renderVotes();
}

async function vote(voteId,optionId){
  if(!currentUser){ msg("로그인이 필요합니다."); return; }
  const {data:existing}=await supabase.from("vote_responses").select("id").eq("vote_id",voteId).eq("user_id",currentUser.id).maybeSingle();
  if(existing){ msg("이미 이 투표에 참여했어요."); return; }

  const {error}=await supabase.from("vote_responses").insert({vote_id:voteId,option_id:optionId,user_id:currentUser.id});
  if(error){ msg(error.code==="23505" ? "이미 이 투표에 참여했어요." : "투표 실패:\n"+error.message); return; }

  msg("투표가 완료되었습니다!");
  renderVotes();
}

async function deleteVote(id){
  if(!isStaff())return;
  if(!confirm("이 투표를 삭제할까요?"))return;
  const {error}=await supabase.from("votes").delete().eq("id",id);
  if(error){ msg("삭제 실패:\n"+error.message); return; }
  renderVotes();
}

async function showLost(id){
  const [{data:lostItem,error:lostError},{data:comments,error:commentsError}]=await Promise.all([
    supabase.from("lost_items").select(`*, profiles(nickname,handle)`).eq("id",id).single(),
    supabase.from("lost_comments").select(`*`).eq("lost_id",id).order("created_at",{ascending:true})
  ]);

  if(lostError || !lostItem){ msg("분실물 정보를 불러오지 못했습니다."); return; }
  if(commentsError){ console.warn(commentsError); }

  const authorIds=[...new Set((comments||[]).map(c=>c.author_id).filter(Boolean))];
  let authorMap={};
  if(authorIds.length){
    const {data:profiles,error:profileError}=await supabase
      .from("profiles")
      .select("id,nickname,handle")
      .in("id",authorIds);

    if(!profileError){
      authorMap = Object.fromEntries((profiles||[]).map(p=>[p.id,p]));
    }
  }

  const normalizedComments=(comments||[]).map(c=>({
    ...c,
    profiles: authorMap[c.author_id] || null
  }));

  const actions=
    (canEdit(lostItem.author_id) ? `<button class="outline btn-sm" onclick="editPost('lost_items',${lostItem.id},'lost')">수정</button>` : "")+
    (canDelete(lostItem.author_id) ? `<button class="danger btn-sm" onclick="deletePost('lost_items',${lostItem.id},'lost')">삭제</button>` : "");

  openModal(`
    <h2>${withEmoticons(escapeHTML(lostItem.title))}</h2>
    <p class="meta">${authorLabel(lostItem.profiles,lostItem.author_id)} · ${fmtDay(lostItem.created_at)}</p>
    <div class="modal-body">${withEmoticons(escapeHTML(lostItem.content))}</div>

    <div class="modal-section">
      <h3>${ic("chat")} 댓글 ${normalizedComments.length}</h3>
      ${normalizedComments.length
        ? normalizedComments.map(c=>`
            <div class="comment">
              <div class="comment-head"><b>${escapeHTML(c.profiles?.nickname||"?")}</b><span class="meta">${escapeHTML(c.profiles?.handle||"?")} · ${formatMetaTimestamp(c)}</span></div>
              <div class="comment-body">${withEmoticons(escapeHTML(c.content),true)}</div>
            </div>
          `).join("")
        : `<p class="meta">아직 댓글이 없습니다. 어디서 찾았는지 알려주세요.</p>`
      }
      <div class="comment-form">
        <textarea class="input" id="lostCommentInput" rows="2" placeholder="예: 2층 복도, 화장실 앞, 교실 책상 밑"></textarea>
        <button class="primary" onclick="addLostComment(${id})">등록</button>
      </div>
    </div>

    ${actions ? `<div class="modal-actions">${actions}</div>` : ""}
  `);
}

async function addLostComment(lostId){
  const el=document.getElementById("lostCommentInput");
  const raw=(el?.value||"").trim();
  if(!raw){ msg("댓글 내용을 입력해주세요."); return; }

  const cleaned=cleanBotCheck(raw);

  const {error}=await supabase.from("lost_comments").insert({lost_id:lostId,author_id:currentUser.id,content});

/* =========================================================
   📋 학급 게시판 (구 SNS, opinions 테이블)
   - 누구나 글쓰기 (실명제: 닉네임+학번 항상 공개)
   - 공감 (feed_likes에서 value=1만 사용)
   - 조회수: 글을 열 때 increment_opinion_view 함수를 호출합니다.
     ⚠️ board-views.sql을 Supabase SQL Editor에서 한 번 실행해야 동작합니다.
     한 사람이 같은 글을 여러 번 열어도 1번만 셉니다.
   - 클린봇 1차 필터, 링크 미리보기, 관리자 "채택" 시 포인트 지급
========================================================= */

// 보완된 유튜브 정규식: watch?v=, shorts/, embed/, live/, youtu.be/ 모두 지원.
// 쿼리스트링 순서(예: ?si=xxx&v=ID)가 달라도 매칭되며, videoId는 항상 11자로 고정.
const YOUTUBE_RE=/(?:youtube\.com\/(?:watch\?(?:[^\s]*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
const IMAGE_RE=/https?:\/\/\S+\.(?:png|jpe?g|gif|webp)(\?\S*)?/i;
const URL_RE=/https?:\/\/[^\s]+/i;

// 영상은 클릭 전까지 로드되지 않도록 썸네일+[보기] 버튼만 우선 표시합니다.
function renderLinkEmbed(text){
  const yt=text.match(YOUTUBE_RE);
  if(yt){
    const videoId=yt[1];
    return `
      <div class="video-placeholder" id="video-${videoId}-${Math.random().toString(36).slice(2,7)}">
        <img src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" loading="lazy" alt="영상 미리보기">
        <button onclick="playFeedVideo(this,'${videoId}')">▶ 보기</button>
      </div>
    `;
  }

  const img=text.match(IMAGE_RE);
  if(img){
    return `<div class="feed-post-embed"><img src="${escapeHTML(img[0])}" loading="lazy"></div>`;
  }

  // 유튜브/이미지가 아닌 일반 링크도 클릭해서 이동할 수 있도록 카드로 보여줍니다.
  const url=text.match(URL_RE);
  if(url){
    let domain=url[0];
    try{ domain=new URL(url[0]).hostname; }catch(e){}
    return `<a class="link-card" href="${escapeHTML(url[0])}" target="_blank" rel="noopener noreferrer"><b>${ic("link")} ${escapeHTML(domain)}</b>${escapeHTML(url[0])}</a>`;
  }

  return "";
}

function playFeedVideo(btn,videoId){
  const wrap=btn.closest(".video-placeholder");
  wrap.outerHTML=`<div class="feed-post-embed"><iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>`;
}

const BOARD_PAGE_SIZE=15;
const BOARD_AUTHOR_FIELDS="nickname,handle,equipped_color,equipped_title,equipped_border";

let boardPosts=[];
let boardQuery="";
let boardSort="latest";
let boardPage=1;
let boardViewsEnabled=false;
const viewedPostIds=new Set();

function formatViewCount(value){
  const n=Number(value)||0;
  if(n>=10000){
    const scaled=n/10000;
    return `${scaled >= 10 ? scaled.toFixed(0) : scaled.toFixed(1).replace(/\.0$/, "")}만`;
  }
  return n.toLocaleString("ko-KR");
}

function boardLocked(){
  return Boolean(appSettings.sns_locked) && profile?.role!=="admin";
}

function summarizeLikes(likes){
  const positive=(likes||[]).filter(l=>l.value===1);
  return {likeCount:positive.length, liked:positive.some(l=>l.user_id===currentUser?.id)};
}

async function renderFeed(){
  showLoading();
  await loadSettings();

  const {data,error}=await supabase
    .from("opinions")
    .select(`*, profiles(${BOARD_AUTHOR_FIELDS}), feed_comments(count), feed_likes(user_id,value)`)
    .order("created_at",{ascending:false});

  if(error){ showError(error.message); return; }

  if(data.length) boardViewsEnabled="view_count" in data[0];
  boardPosts=data.map((post,i)=>({
    ...post,
    no:data.length-i,
    commentCount:post.feed_comments?.[0]?.count || 0,
    ...summarizeLikes(post.feed_likes)
  }));
  renderBoardList();
}

function filteredBoardPosts(){
  const q=boardQuery.trim().toLowerCase();
  const posts=!q ? [...boardPosts] : boardPosts.filter(post=>
    [post.title,post.content,post.profiles?.nickname,post.profiles?.handle]
      .some(value=>String(value||"").toLowerCase().includes(q))
  );
  if(boardSort==="popular"){
    posts.sort((a,b)=>b.likeCount-a.likeCount || (b.view_count||0)-(a.view_count||0) || b.no-a.no);
  }
  return posts;
}

function renderBoardList(){
  const locked=boardLocked();

  document.getElementById("app").innerHTML=`
    <div class="page-title">
      <h1>게시판</h1>
      <p>누구나 자유롭게 글을 쓰고, 공감과 댓글로 이야기하는 우리 반 게시판이에요.</p>
    </div>

    ${locked ? `<div class="lock-banner">${ic("lock")} 관리자가 게시판 글쓰기와 댓글을 잠시 막아뒀어요. 글은 계속 읽을 수 있어요.</div>` : ""}
    ${isStaff() && !boardViewsEnabled && boardPosts.length
      ? `<div class="notify-banner">${ic("eye")} 조회수가 아직 꺼져 있어요. Supabase SQL Editor에서 board-views.sql을 한 번 실행하면 켜져요. (관리자에게만 보이는 안내)</div>`
      : ""}

    <div class="toolbar">
      <div class="board-tabs">
        <button class="board-tab ${boardSort==="latest"?"active":""}" onclick="setBoardSort('latest')">최신순</button>
        <button class="board-tab ${boardSort==="popular"?"active":""}" onclick="setBoardSort('popular')">공감순</button>
      </div>
      <div class="toolbar-right">
        <input class="input search-input" placeholder="제목, 내용, 작성자 검색" value="${escapeHTML(boardQuery)}" oninput="onBoardSearch(this.value)">
        <button class="primary" onclick="feedPostForm()" ${locked?"disabled":""}>${ic("pencil")} 글쓰기</button>
      </div>
    </div>

    <div id="boardList"></div>
  `;
  renderBoardRows();
}

// 검색할 때는 목록만 다시 그려서 입력창 포커스가 유지되게 함
function renderBoardRows(){
  const el=document.getElementById("boardList");
  if(!el) return;

  const posts=filteredBoardPosts();
  const pageCount=Math.max(1,Math.ceil(posts.length/BOARD_PAGE_SIZE));
  boardPage=Math.min(Math.max(1,boardPage),pageCount);
  const pagePosts=posts.slice((boardPage-1)*BOARD_PAGE_SIZE, boardPage*BOARD_PAGE_SIZE);

  el.innerHTML=`
    <div class="board">
      <div class="board-head">
        <span class="c-no">번호</span><span>제목</span><span>작성자</span>
        <span class="c-date">날짜</span><span class="c-num">조회</span><span class="c-num">공감</span>
      </div>
      ${pagePosts.length
        ? pagePosts.map(boardRowHtml).join("")
        : `<div class="list-empty">${boardQuery.trim() ? "검색 결과가 없어요." : "아직 올라온 글이 없어요. 첫 글을 남겨보세요!"}</div>`}
    </div>
    ${pageCount>1 ? `
      <div class="pagination">
        ${Array.from({length:pageCount},(_,i)=>i+1).map(n=>`
          <button class="page-btn ${n===boardPage?"active":""}" onclick="setBoardPage(${n})">${n}</button>
        `).join("")}
      </div>
    ` : ""}
  `;
}

function boardRowHtml(post){
  const nickname=escapeHTML(post.profiles?.nickname || "알 수 없음");
  const nameStyle=post.profiles?.equipped_color ? `style="color:${escapeHTML(post.profiles.equipped_color)}"` : "";
  const views=boardViewsEnabled ? formatViewCount(post.view_count) : "-";
  const date=shortDate(post.created_at);

  return `
    <div class="board-row" onclick="openBoardPost(${post.id})">
      <span class="c-no">${post.is_featured ? ic("star") : post.no}</span>
      <span class="c-title">
        <span class="c-title-text">${withEmoticons(escapeHTML(post.title || "제목 없음"))}</span>
        ${post.commentCount ? `<span class="comment-count">[${post.commentCount}]</span>` : ""}
      </span>
      <span class="c-author handle-link" ${nameStyle} onclick="event.stopPropagation();showUserProfile('${escapeHTML(post.author_id)}')" title="프로필 보기">${nickname}</span>
      <span class="c-date">${date}</span>
      <span class="c-num">${views}</span>
      <span class="c-num ${post.liked?"liked":""}">${post.likeCount}</span>
      <span class="board-mobile-meta">${nickname} · ${date}${boardViewsEnabled ? ` · 조회 ${views}` : ""} · 공감 ${post.likeCount}</span>
    </div>
  `;
}

function onBoardSearch(value){
  boardQuery=value;
  boardPage=1;
  renderBoardRows();
}

function setBoardSort(sort){
  boardSort=sort;
  boardPage=1;
  renderBoardList();
}

function setBoardPage(page){
  boardPage=page;
  renderBoardRows();
  window.scrollTo(0,0);
}

// refresh=true면 로딩 화면 없이 같은 자리에서 다시 그림 (댓글/수정 후)
async function openBoardPost(id,refresh=false){
  setActiveNav("feed");
  if(!refresh) showLoading();

  const [postResult,commentsResult]=await Promise.all([
    supabase.from("opinions").select(`*, profiles(${BOARD_AUTHOR_FIELDS}), feed_likes(user_id,value)`).eq("id",id).maybeSingle(),
    supabase.from("feed_comments").select(`*, profiles(${BOARD_AUTHOR_FIELDS})`).eq("post_id",id).order("created_at")
  ]);

  if(postResult.error){ showError(postResult.error.message); return; }
  if(!postResult.data){ msg("삭제되었거나 없는 글이에요."); renderFeed(); return; }

  const post={...postResult.data, ...summarizeLikes(postResult.data.feed_likes)};
  boardViewsEnabled="view_count" in post;
  renderBoardPost(post, commentsResult.data||[]);
  if(!refresh) window.scrollTo(0,0);
  recordPostView(post);
}

function renderBoardPost(post,comments){

  const flagged=containsBadWord(post.content);
  const actions=
    (isStaff() && !post.is_featured ? `<button class="outline btn-sm" onclick="featurePost(${post.id})">${ic("star")} 채택하기 (+${FEATURE_POINTS}P)</button>` : "")+
    (canEdit(post.author_id) ? `<button class="outline btn-sm" onclick="editPost('opinions',${post.id},'feed')">수정</button>` : "")+
    (canDelete(post.author_id) ? `<button class="danger btn-sm" onclick="deleteFeedPost(${post.id})">삭제</button>` : "");

  document.getElementById("app").innerHTML=`
    <button class="ghost back-btn" onclick="go('feed')">← 목록으로</button>

    <article class="card post">
      ${post.is_featured ? `<span class="badge badge-success">${ic("star")} 채택된 글</span>` : ""}
      <h1 class="post-title">${withEmoticons(escapeHTML(post.title || "제목 없음"))}</h1>
      <div class="post-meta">
        <span class="post-author">${feedAuthorLabel(post.profiles,post.author_id)}</span>
        <span>${formatMetaTimestamp(post)}</span>
        ${boardViewsEnabled ? `<span>조회 <span id="postViewCount" data-post-id="${post.id}">${formatViewCount(post.view_count)}</span></span>` : ""}
      </div>

      <div class="post-body">${withEmoticons(escapeHTML(post.content || ""),true)}</div>
      ${renderLinkEmbed(post.content || "")}
      ${flagged ? `<div class="feed-warning">${ic("alert")} 클린봇이 부적절한 표현을 감지한 글이에요.</div>` : ""}

      <div class="post-like">
        <button id="likeBtn" class="like-btn ${post.liked?"active":""}" onclick="toggleLike(${post.id})">
          <span class="like-icon">${ic("heart")}</span>
          <span>공감 <b class="like-count">${post.likeCount}</b></span>
        </button>
      </div>

      ${actions ? `<div class="post-actions">${actions}</div>` : ""}
    </article>

    <section class="card comments">
      <h3>댓글 <span class="comment-total">${comments.length}</span></h3>

        ? comments.map(renderFeedComment).join("")

        : `<div class="comment-form">
             <textarea class="input" id="commentInput-${post.id}" rows="2" placeholder="댓글을 남겨보세요"></textarea>
             <button class="primary" onclick="addComment(${post.id})">등록</button>
           </div>`}
    </section>
  `;
}

function renderFeedComment(c){

async function toggleLike(postId){
  if(!currentUser){ msg("로그인이 필요합니다."); return; }
  const btn=document.getElementById("likeBtn");
  if(btn) btn.disabled=true;

  const {data:existing,error}=await supabase
    .from("feed_likes").select("id,value").eq("post_id",postId).eq("user_id",currentUser.id).maybeSingle();

  let result={error};
  if(!error){
    if(existing?.value===1) result=await supabase.from("feed_likes").delete().eq("id",existing.id);
    // 예전 👎(value=-1)은 공감으로 바꿔줌
    else if(existing) result=await supabase.from("feed_likes").update({value:1}).eq("id",existing.id);
    else result=await supabase.from("feed_likes").insert({post_id:postId,user_id:currentUser.id,value:1});
  }
  if(result.error) msg("공감 처리 실패: "+result.error.message);

  const {data:likes}=await supabase.from("feed_likes").select("user_id,value").eq("post_id",postId);
  const {likeCount,liked}=summarizeLikes(likes);
  const cached=boardPosts.find(p=>p.id===postId);
  if(cached) Object.assign(cached,{likeCount,liked});

  const current=document.getElementById("likeBtn");
  if(current){
    current.disabled=false;
    current.classList.toggle("active",liked);
    current.querySelector(".like-count").textContent=likeCount;
  }
}

// 관리자/선생님이 "채택" -> 포인트 지급
// ⚠️ profiles.points에 대한 UPDATE 권한이 스태프에게 RLS로 허용돼 있어야 동작합니다.
async function featurePost(postId){
  if(!isStaff())return;
  if(!confirm(`이 글을 채택하고 작성자에게 ${FEATURE_POINTS}P를 지급할까요?`))return;

  const {data:post,error:postError}=await supabase.from("opinions").select("author_id,is_featured").eq("id",postId).single();
  if(postError){ msg(postError.message); return; }
  if(post.is_featured){ msg("이미 채택된 글입니다."); return; }

  const {error:updateError}=await supabase.from("opinions").update({is_featured:true}).eq("id",postId);
  if(updateError){ msg("채택 처리 실패: "+updateError.message); return; }

  const {data:authorProfile,error:profileError}=await supabase.from("profiles").select("points").eq("id",post.author_id).single();
  if(profileError){ msg("포인트 지급 실패: "+profileError.message); return; }

  const {error:pointError}=await supabase
    .from("profiles")
    .update({points:(authorProfile.points||0)+FEATURE_POINTS})
    .eq("id",post.author_id);

  if(pointError){
    msg("글은 채택되었지만 포인트 지급에 실패했습니다: "+pointError.message+"\n(RLS 정책에서 스태프의 profiles.points 수정 권한을 확인해주세요.)");
  }else{
    msg(`채택 완료! 작성자에게 ${FEATURE_POINTS}P가 지급되었습니다.`);
  }

  openBoardPost(postId,true);
}

async function saveEditedPost(table,id,page){
  let payload={};

  if(table==="notices"){
    const titleRaw=document.getElementById("editTitle").value.trim();
    const contentRaw=document.getElementById("editContent").value.trim();
    if(!titleRaw||!contentRaw){ msg("제목과 내용을 모두 입력해주세요."); return; }
    const cleaned=cleanBotCheck(titleRaw,contentRaw); if(!cleaned)return; const [title,content]=cleaned;
    payload={title,content,updated_at:new Date().toISOString()};
  }
  else if(table==="schedules"){
    const titleRaw=document.getElementById("editTitle").value.trim();
    const event_date=document.getElementById("editDate").value;
    const contentRaw=document.getElementById("editContent").value.trim();
    if(!titleRaw||!event_date){ msg("제목과 날짜를 입력해주세요."); return; }
    const cleaned=cleanBotCheck(titleRaw,contentRaw); if(!cleaned)return; const [title,content]=cleaned;
    payload={title,event_date,content,updated_at:new Date().toISOString()};
  }
  else if(table==="assignments"){
    const subjectRaw=document.getElementById("editSubject").value.trim();
    const titleRaw=document.getElementById("editTitle").value.trim();
    const event_date=document.getElementById("editDate").value;
    const contentRaw=document.getElementById("editContent").value.trim();
    if(!subjectRaw||!titleRaw||!event_date){ msg("과목, 제목, 날짜를 입력해주세요."); return; }
    const cleaned=cleanBotCheck(subjectRaw,titleRaw,contentRaw); if(!cleaned)return; const [subject,title,content]=cleaned;
    payload={subject,title,event_date,content,updated_at:new Date().toISOString()};
  }
  else if(table==="lost_items"){
    const titleRaw=document.getElementById("editTitle").value.trim();
    const contentRaw=document.getElementById("editContent").value.trim();
    if(!titleRaw||!contentRaw){ msg("물건 이름과 설명을 입력해주세요."); return; }
    const cleaned=cleanBotCheck(titleRaw,contentRaw); if(!cleaned)return; const [title,content]=cleaned;
    payload={title,content,updated_at:new Date().toISOString()};
  }
  else if(table==="opinions"){
    const titleRaw=document.getElementById("editTitle").value.trim();
    const contentRaw=document.getElementById("editContent").value.trim();
    if(!titleRaw||!contentRaw){ msg("제목과 내용을 모두 입력해주세요."); return; }
    const cleaned=cleanBotCheck(titleRaw,contentRaw); if(!cleaned)return; const [title,content]=cleaned;
    payload={title,content,updated_at:new Date().toISOString()};
  }
  else {
    msg("지원하지 않는 게시판입니다."); return;
  }

  const run=body=>supabase.from(table).update(body).eq("id",id).select("id");
  let result=await run(payload);

  // updated_at 칸이 없는 테이블이면 그 칸만 빼고 다시 저장 (db-fixes.sql을 실행하면 칸이 생김)
  if(result.error && /updated_at/.test(result.error.message||"")){
    const {updated_at,...withoutStamp}=payload;
    result=await run(withoutStamp);
  }

  if(result.error){
    msg("수정 실패:\n" + result.error.message);
    return;
  }
  // 권한(RLS)에 막히면 오류 없이 0건만 바뀌므로 따로 확인
  if(!result.data?.length){
    msg("저장되지 않았어요. 수정 권한이 없는 것 같아요.\n(관리자: Supabase RLS에 이 테이블의 UPDATE 정책이 있는지 확인해주세요)");
    return;
  }

  msg("수정되었습니다.");
  closeModal();
  if(table==="opinions") openBoardPost(id,true);
  else render(page);
}

async function deletePost(table,id,page){
  if(!confirm("정말 삭제할까요?"))return;
  const {data,error}=await supabase.from(table).select("author_id").eq("id",id).single();
  if(error){ msg(error.message); return; }
  if(!canDelete(data.author_id)){ msg("삭제 권한이 없습니다."); return; }
  const result=await supabase.from(table).delete().eq("id",id);
  if(result.error){ msg("삭제 실패:\n"+result.error.message); return; }
  closeModal();
  render(page);
}

function nicknameCooldown(profile){
  if(!profile?.nickname_updated_at) return {canChange:true,daysLeft:0};
  const lastUpdate=new Date(profile.nickname_updated_at);
  const diffDays=Math.floor((new Date()-lastUpdate)/(1000*60*60*24));
  if(diffDays>=NICKNAME_COOLDOWN_DAYS) return {canChange:true,daysLeft:0};
  return {canChange:false,daysLeft:NICKNAME_COOLDOWN_DAYS-diffDays};
}

const SHOP_PREVIEW_LIMIT=4;
const SHOP_EXPANDED={font:false,border:false,title:false};

function renderShopCategory(category,items){
  const visibleItems=items.length>SHOP_PREVIEW_LIMIT && !SHOP_EXPANDED[category]
    ? items.slice(0,SHOP_PREVIEW_LIMIT)
    : items;

  const extraItems=items.length>SHOP_PREVIEW_LIMIT ? `
    <div class="shop-more">
      <button class="ghost btn-sm" onclick="toggleShopCategory('${category}')">
        ${SHOP_EXPANDED[category] ? "접기 ▲" : `더보기 (${items.length-SHOP_PREVIEW_LIMIT}개) ▼`}
      </button>
    </div>
  ` : "";

  return `
    <div class="shop-grid">
      ${visibleItems.map(item=>renderShopItem(item,category)).join("")}
      ${extraItems}
    </div>
  `;
}

function toggleShopCategory(category){
  SHOP_EXPANDED[category]=!SHOP_EXPANDED[category];
  renderAccount();
}

function renderShopItem(item,category){
  const owned=item.price===0 || (profile.owned_items||[]).includes(item.id);
  const equipped=
    (category==="font" && profile.equipped_font===item.id) ||
    (category==="border" && `border-${profile.equipped_border}`===item.id) ||
    (category==="title" && profile.equipped_title===item.text);

  let buttonHtml;
  if(equipped){
    buttonHtml=`<button class="outline" disabled>✓ 적용 중</button>`;
  }else if(owned){
    buttonHtml=`<button class="primary" onclick="equipItem('${category}','${item.id}')">적용하기</button>`;
  }else{
    buttonHtml=`<button class="outline" onclick="buyItem('${category}','${item.id}')">구매하기</button>`;
  }

  return `
    <div class="shop-item ${owned?"owned":""}">
      <div class="icon">${ic(item.icon)}</div>
      <div class="name">${escapeHTML(item.name)}</div>
      <div class="price">${item.price===0 ? "무료" : `${ic("coin")} ${item.price}P`}</div>
      ${buttonHtml}
    </div>
  `;
}

async function buyItem(category,itemId){
  const pool=category==="font"?FONT_ITEMS:category==="border"?BORDER_ITEMS:TITLE_ITEMS;
  const item=pool.find(i=>i.id===itemId);
  if(!item)return;

  if((profile.points||0)<item.price){ msg("포인트가 부족합니다."); return; }
  if(!confirm(`'${item.name}'을(를) ${item.price}P에 구매할까요?`))return;

  const newOwned=[...(profile.owned_items||[]),itemId];
  const newPoints=(profile.points||0)-item.price;

  const {error}=await supabase.from("profiles").update({points:newPoints,owned_items:newOwned}).eq("id",currentUser.id);
  if(error){ msg("구매 실패: "+error.message); return; }

  await loadProfile();
  await equipItem(category,itemId);
}

async function equipItem(category,itemId){
  const update={};

  if(category==="font"){
    update.equipped_font=itemId;
  }else if(category==="border"){
    const item=BORDER_ITEMS.find(i=>i.id===itemId);
    update.equipped_border=item?.cssClass||"none";
  }else if(category==="title"){
    const item=TITLE_ITEMS.find(i=>i.id===itemId);
    update.equipped_title=item?.text||null;
  }

  const {error}=await supabase.from("profiles").update(update).eq("id",currentUser.id);
  if(error){ msg("적용 실패: "+error.message); return; }

  await loadProfile();
  applyEquippedStyles();
  renderAccount();
}

async function buyNicknameColor(){
  const color=document.getElementById("nicknameColorPicker").value;
  const alreadyOwned=(profile.owned_items||[]).includes(COLOR_ITEM.id);

  if(!alreadyOwned){
    if((profile.points||0)<COLOR_ITEM.price){ msg("포인트가 부족합니다."); return; }
    if(!confirm(`닉네임 색상 기능을 ${COLOR_ITEM.price}P에 구매할까요? (색은 이후 무료로 다시 바꿀 수 있어요)`))return;
  }

  const update={equipped_color:color};
  if(!alreadyOwned){
    update.points=(profile.points||0)-COLOR_ITEM.price;
    update.owned_items=[...(profile.owned_items||[]),COLOR_ITEM.id];
  }

  const {error}=await supabase.from("profiles").update(update).eq("id",currentUser.id);
  if(error){ msg("적용 실패: "+error.message); return; }

  await loadProfile();
  renderUserInfo();
  renderAccount();
}

async function applyStudentPoints(studentId,inputId){
  const input=document.getElementById(inputId);
  if(!input){ msg("입력창을 찾지 못했습니다."); return; }

  const raw=input.value.trim();
  if(!/^[+-]?\d+$/.test(raw)){ msg("포인트 조정 값은 숫자 또는 +,- 기호가 포함된 값만 가능합니다.\n예: +10, -20"); return; }

  const delta=Number(raw);
  const {data:target,error:fetchErr}=await supabase.from("profiles").select("*").eq("id",studentId).single();
  if(fetchErr || !target){ msg("학생 정보를 불러오지 못했습니다."); return; }

  const nextPoint=(Number(target.points)||0)+delta;
  const {error}=await supabase.from("profiles").update({points:Math.max(0,nextPoint)}).eq("id",studentId);
  if(error){ msg("포인트 변경 실패: "+error.message); return; }

  msg(`학생 포인트가 ${delta > 0 ? "+"+delta : delta}P 반영되었습니다.`);
  renderAccount();
}

/* =========================================================
   다른 사람 프로필 보기 (게시판에서 학번을 눌렀을 때)
   ⚠️ supabase에 "profile_messages" 테이블(id, target_id, author_id,
   content, created_at)이 필요하며, 로그인한 사용자가 누구에게나
   메시지를 INSERT 할 수 있도록 RLS를 설정해주세요.
========================================================= */

async function showUserProfile(targetId){
  const {data:p,error}=await supabase
    .from("profiles")
    .select("nickname,handle,role,equipped_border,equipped_title,equipped_color,status_message")
    .eq("id",targetId).single();

  if(error || !p){ msg("프로필을 불러오지 못했습니다."); return; }

  const {data:messageRows,error:messageError}=await supabase
    .from("profile_messages")
    .select("*")
    .eq("target_id",targetId)
    .order("created_at",{ascending:false});

  if(messageError){ msg("메시지를 불러오지 못했습니다."); return; }

  const authorIds=[...new Set((messageRows||[]).map(m=>m.author_id).filter(Boolean))];
  let authorMap={};
  if(authorIds.length){
    const {data:profiles,error:profilesError}=await supabase
      .from("profiles")
      .select("id,nickname,handle")
      .in("id",authorIds);

    if(!profilesError){
      authorMap = Object.fromEntries((profiles||[]).map(profile=>[profile.id,profile]));
    }
  }

  const messages=(messageRows||[]).map(m=>({
    ...m,
    profiles: authorMap[m.author_id] || null
  }));

  openModal(renderProfileModal(targetId,p,messages));
}

      <div>
        <div class="profile-name">

          ${p.equipped_title ? `<span class="badge badge-title">${titleHtml(p.equipped_title)}</span>` : ""}
        </div>
        <div class="meta">학번 ${escapeHTML(p.handle)} · ${roleBadge(p.role)}</div>
        ${p.status_message ? `<div class="profile-status">${ic("chat")} ${withEmoticons(escapeHTML(p.status_message))}</div>` : ""}

// 메시지는 쓴 사람 본인만 삭제할 수 있어요 (관리자는 예외)
function canDeleteProfileMessage(m,targetId){
  if(!currentUser)return false;
  return m.author_id===currentUser.id || profile?.role==="admin";
}

async function deleteProfileMessage(id,targetId){
  if(!confirm("이 메시지를 삭제할까요?"))return;
  const {data,error}=await supabase.from("profile_messages").delete().eq("id",id).select("id");
  if(error){ msg("삭제 실패: "+error.message); return; }
  if(!data || !data.length){ msg("삭제 권한이 없어요. (DB 삭제 정책을 확인해주세요)"); return; }
  showUserProfile(targetId);
}

async function addProfileMessage(targetId){
  const input=document.getElementById("profileMsgInput");
  const contentRaw=input.value.trim();
  if(!contentRaw)return;

  const cleaned=cleanBotCheck(contentRaw);
  if(!cleaned)return;
  const [content]=cleaned;

  const {error}=await supabase.from("profile_messages").insert({target_id:targetId,author_id:currentUser.id,content});
  if(error){ msg("메시지 등록 실패: "+error.message); return; }

  showUserProfile(targetId);
}

async function updateNickname(){
  const newNicknameRaw=document.getElementById("newNickname").value.trim();
  if(!newNicknameRaw){ msg("닉네임을 입력해주세요."); return; }
  if(newNicknameRaw===profile.nickname){ msg("현재 닉네임과 동일합니다."); return; }

  const {canChange,daysLeft}=nicknameCooldown(profile);
  if(!canChange){ msg(`닉네임은 ${NICKNAME_COOLDOWN_DAYS}일에 한 번만 변경 가능합니다. (남은 기간: ${daysLeft}일)`); return; }

  const cleaned=cleanBotCheck(newNicknameRaw);
  if(!cleaned)return;
  const [newNickname]=cleaned;

  if(!confirm(`닉네임을 '${newNickname}'(으)로 변경하시겠습니까?\n변경 후 ${NICKNAME_COOLDOWN_DAYS}일 동안 재변경이 불가능합니다.`))return;

  const {error}=await supabase.from("profiles").update({nickname:newNickname,nickname_updated_at:new Date().toISOString()}).eq("id",currentUser.id);
  if(error){ msg("닉네임 변경 실패: "+error.message); return; }

  msg("닉네임이 성공적으로 변경되었습니다!");
  await loadProfile();
  renderUserInfo();
  renderAccount();
}

const OLD_POST_TABLE_MAP={notice:"notices",schedule:"schedules",assignment:"assignments",lost_item:"lost_items",opinion:"opinions"};
const OLD_POST_LABELS={notice:"공지",schedule:"일정",assignment:"수행평가",lost_item:"분실물",opinion:"게시판"};

async function oldPosts(){
  if(!isStaff())return;
  const {data,error}=await supabase.rpc("get_old_posts");
  if(error){ msg(error.message); return; }

  openModal(`
    <h2>${ic("broom")} 오래된 게시글</h2>
    <p class="meta">2개월 이상 지난 게시글 ${data.length}개</p>
    ${data.length ? data.map(n=>`
      <div class="old-post-row">
        <div class="list-main">
          <div class="list-title"><span class="badge">${escapeHTML(OLD_POST_LABELS[n.post_type]||n.post_type)}</span> ${withEmoticons(escapeHTML(n.title))}</div>
          <div class="list-sub">${fmtDay(n.created_at)}</div>
        </div>
        <button class="danger btn-sm" onclick="deleteOldPost('${n.post_type}',${n.post_id})">삭제</button>
      </div>
    `).join("") : `<p>정리할 게시글이 없습니다.</p>`}
  `);
}

async function deleteOldPost(postType,id){
  if(!isStaff())return;
  const table=OLD_POST_TABLE_MAP[postType];
  if(!table)return;
  if(!confirm("이 게시글을 삭제할까요?"))return;
  const {error}=await supabase.from(table).delete().eq("id",id);
  if(error){ msg("삭제 실패:\n"+error.message); return; }
  oldPosts();
}
