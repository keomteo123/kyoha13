<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3반 웹사이트</title>
<meta name="theme-color" content="#3268e8">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

:root{
  --main:#3268e8;
  --dark:#2453c7;
  --light:#edf2fe;
  --bg:#f4f5f7;
  --surface:#ffffff;
  --surface-2:#f6f7f9;
  --border:#e5e8eb;
  --border-strong:#d1d6db;
  --danger:#e5484d;
  --danger-soft:#fdeeee;
  --success:#1f9d55;
  --success-soft:#e7f6ee;
  --warn:#a76a00;
  --warn-soft:#fff5dc;
  --text:#191f28;
  --text-2:#4e5968;
  --muted:#8b95a1;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 16px 40px rgba(16,24,40,.14)
}

html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:15px;
  line-height:1.55;
  word-break:keep-all;
  overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased
}

body.font-cute{ font-family:"Gaegu","Pretendard Variable",cursive }
body.font-round{ font-family:"Nanum Gothic","Pretendard Variable",sans-serif }
body.font-serif{ font-family:"Nanum Myeongjo",serif }

button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{line-height:1.35;letter-spacing:-.02em}

/* ---------- 헤더 / 메뉴 ---------- */
header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border)}
.top{max-width:1080px;margin:auto;padding:12px 20px 4px;display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;letter-spacing:-.02em;cursor:pointer}
.logo img{flex-shrink:0;border-radius:9px}
.logo small{display:block;margin-top:1px;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:0}
.user-area{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#userInfo{display:flex;align-items:center;gap:6px}
.user-badge{padding:4px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:13px;font-weight:600}
.points-badge{padding:4px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:700;white-space:nowrap}

.nav-inner{max-width:1080px;margin:auto;padding:0 12px;display:flex;overflow-x:auto;scrollbar-width:none}
.nav-inner::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;padding:10px 10px 11px;border:0;border-bottom:2px solid transparent;background:none;white-space:nowrap;font-size:14px;font-weight:600;color:var(--muted);transition:color .15s}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--text);border-bottom-color:var(--main)}

main{max-width:1080px;margin:28px auto 48px;padding:0 20px}
.site-footer{max-width:1080px;margin:0 auto;padding:0 20px 36px;text-align:center;color:var(--muted);font-size:12px}

.page-title{margin-bottom:20px}
.page-title h1{margin:0 0 4px;font-size:24px;font-weight:800}
.page-title p{margin:0;color:var(--muted);font-size:14px}
.sub-heading{margin:28px 0 10px;font-size:15px;font-weight:700;color:var(--text-2)}

/* ---------- 카드 ---------- */
.card,.table-wrap,.poll,.stat-card,.game-card,.shop-item,.dday-card,.list,.board,.calendar,.admin-box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)
}
.card{padding:20px}
.card h3{margin:0 0 12px;font-size:16px;font-weight:700}
.card-desc{margin:-4px 0 14px;color:var(--text-2);font-size:14px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.section-head h3{margin:0}
.link-btn{padding:2px 0;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.link-btn:hover{color:var(--main)}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar-count{color:var(--muted);font-size:14px}
.toolbar-right{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;min-width:0}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-row.end{justify-content:flex-end}

/* ---------- 버튼 ---------- */
.primary,.outline,.danger,.ghost{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:38px;padding:0 14px;border:1px solid transparent;border-radius:var(--radius-sm);
  font-size:14px;font-weight:600;white-space:nowrap;text-decoration:none;
  transition:background .15s,border-color .15s,color .15s
}
.primary{background:var(--main);color:#fff}
.primary:hover{background:var(--dark)}
.outline{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.outline:hover{background:var(--surface-2)}
.danger{background:var(--surface);border-color:#f2c4c6;color:var(--danger)}
.danger:hover{background:var(--danger-soft)}
.ghost{padding:0 10px;background:none;color:var(--text-2)}
.ghost:hover{background:rgba(0,0,0,.04);color:var(--text)}
.btn-sm{min-height:32px;padding:0 10px;border-radius:8px;font-size:13px}
.primary:disabled,.outline:disabled,.danger:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 표 ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;min-width:640px;border-collapse:collapse;font-size:14px}
th,td{padding:11px 14px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{background:var(--surface-2);color:var(--text-2);font-size:13px;font-weight:600}
tr:last-child td{border-bottom:0}
.empty{padding:48px 20px!important;text-align:center;color:var(--muted)}

/* ---------- 입력 ---------- */
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:14px;font-weight:600;color:var(--text-2)}
.input,.form-group input,.form-group textarea,.form-group select,.login-box input{
  width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s
}
.input:focus,.form-group input:focus,.form-group textarea:focus,.form-group select:focus,.login-box input:focus{
  border-color:var(--main);box-shadow:0 0 0 3px rgba(50,104,232,.15)
}
.input:disabled,.form-group input:disabled{background:var(--surface-2);color:var(--muted)}
textarea{min-height:140px;resize:vertical;line-height:1.6}
.hint{margin:-6px 0 16px;color:var(--muted);font-size:13px}
.inline-form{display:flex;gap:8px;align-items:center}
.inline-form .input{flex:1;min-width:0}

/* ---------- 모달 ---------- */
.modal-bg{position:fixed;inset:0;z-index:10001;display:none;justify-content:center;align-items:center;padding:20px;background:rgba(17,24,39,.45)}
.modal{position:relative;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:26px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg)}
.modal h2{margin:0 0 12px;padding-right:40px;font-size:20px}
.modal-close{position:absolute;top:16px;right:16px;width:34px;height:34px;border:0;border-radius:50%;background:var(--surface-2);color:var(--text-2);font-size:20px;line-height:1}
.modal-close:hover{background:var(--border)}
.modal-body{margin-top:14px;white-space:pre-wrap;line-height:1.7}
.modal-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.modal-section h3{margin:0 0 6px;font-size:15px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* ---------- 로그인 ---------- */
.login-page{position:fixed;inset:0;z-index:10000;display:flex;justify-content:center;align-items:center;padding:20px;background:var(--bg)}
.login-box{width:380px;max-width:100%;padding:36px 28px 28px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg)}
.login-mark{display:block;width:56px;height:56px;margin:0 auto 14px;border-radius:16px}
.login-box h1{margin:0 0 4px;text-align:center;font-size:22px}
.login-sub{margin:0 0 26px;text-align:center;color:var(--muted);font-size:14px}
.login-box .primary{width:100%;min-height:46px;margin-top:6px;font-size:15px}
.login-help{margin:12px 0 0;text-align:center;color:var(--muted);font-size:12px}

/* ---------- 관리자 ---------- */
.admin-title{margin:36px 0 14px;font-size:18px}
.admin-box{padding:20px;margin-bottom:14px}
.admin-box strong{display:block;margin-bottom:4px;font-size:15px}
.admin-box p{margin:0 0 14px;color:var(--text-2);font-size:14px}
.admin-box .table-wrap{box-shadow:none}
.point-input{flex:none!important;width:76px!important;padding:6px 8px!important;text-align:center}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.stat-card{padding:16px;text-align:center;font-size:13px;color:var(--text-2)}
.stat-card b{display:block;margin-top:4px;font-size:24px;color:var(--text)}
.old-post-row{display:flex;align-items:center;gap:12px;padding:12px 0}
.old-post-row + .old-post-row{border-top:1px solid var(--border)}

/* ---------- 캘린더 ---------- */
.calendar{overflow:hidden}
.calendar-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.calendar-head b{font-size:17px}
.calendar-scroll{overflow-x:auto}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:600px}
.day-head{padding:9px 0;border-bottom:1px solid var(--border);text-align:center;font-size:12px;font-weight:600;color:var(--text-2)}
.day{min-width:0;min-height:98px;padding:6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.day:nth-child(7n){border-right:0}
.day:nth-last-child(-n+7){border-bottom:0}
.empty-day{background:var(--surface-2)}
.day-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:600}
.day-head.sun,.day.sun .day-num{color:var(--danger)}
.day-head.sat,.day.sat .day-num{color:var(--main)}
.day.today .day-num{background:var(--main);color:#fff}
.event{margin-top:3px;padding:2px 6px;border-radius:6px;background:var(--light);color:var(--main);font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event.assignment{background:var(--warn-soft);color:var(--warn)}
.calendar-legend{display:flex;gap:14px;padding:12px 18px;border-top:1px solid var(--border);color:var(--text-2);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:50%;background:var(--main);vertical-align:middle}
.dot.assignment{background:var(--warn)}

/* ---------- 목록 ---------- */
.list{overflow:hidden}
.list-item{display:flex;align-items:center;gap:14px;padding:14px 18px}
.list-item + .list-item{border-top:1px solid var(--border)}
.list-item.clickable{cursor:pointer;transition:background .12s}
.list-item.clickable:hover{background:var(--surface-2)}
.list-main{flex:1;min-width:0}
.list-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-desc{margin-top:2px;color:var(--text-2);font-size:14px;white-space:pre-wrap;word-break:break-word}
.list-desc.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.list-sub{margin-top:3px;color:var(--muted);font-size:13px}
.list-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.list-actions{display:flex;gap:6px}
.list-arrow{color:var(--border-strong);font-size:22px;line-height:1}
.list-empty{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px}
.list-past .list-item{opacity:.6}
.date-tile{flex-shrink:0;width:50px;padding:6px 0;border-radius:12px;background:var(--surface-2);text-align:center;line-height:1.2}
.date-tile .m{display:block;color:var(--muted);font-size:11px;font-weight:600}
.date-tile .d{display:block;font-size:19px;font-weight:800}
.date-tile .w{display:block;color:var(--muted);font-size:11px}

.preview-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.preview-row + .preview-row{border-top:1px solid var(--border)}
.preview-title{min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-row:hover .preview-title{color:var(--main)}
.preview-row > .meta,.preview-row > .badge{flex-shrink:0}

.meta{color:var(--muted);font-size:13px}

/* ---------- 투표 ---------- */
.poll{padding:20px;margin-bottom:14px}
.poll-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.poll-head h3{margin:0 0 4px;font-size:17px}
.poll-desc{margin:12px 0 0;color:var(--text-2);white-space:pre-wrap}
.poll-options{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.poll-option{width:100%;padding:12px 14px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);text-align:left;font-weight:500;transition:background .15s,border-color .15s,color .15s}
.poll-option:hover{border-color:var(--main);background:var(--light);color:var(--main)}
.poll-done{margin:14px 0 0;color:var(--main);font-size:14px;font-weight:600}
.poll-admin{display:flex;justify-content:flex-end;margin-top:16px}
.vote-result{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.vote-row + .vote-row{margin-top:12px}
.vote-row-head{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.vote-row-head span:last-child{color:var(--muted);white-space:nowrap}
.vote-row.mine .vote-row-head span:first-child{color:var(--main);font-weight:700}
.vote-bar{height:8px;margin-top:6px;border-radius:999px;background:#eef0f3;overflow:hidden}
.vote-bar-inner{height:100%;border-radius:999px;background:#b9cbf6;transition:width .3s}
.vote-row.mine .vote-bar-inner{background:var(--main)}
.vote-option-inputs{display:flex;flex-direction:column;gap:8px}

/* ---------- 프로필 ---------- */
.profile-box{position:relative;display:flex;align-items:center;gap:14px;padding:18px 20px;margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--main);color:#fff;display:flex;justify-content:center;align-items:center;font-weight:800;font-size:16px;flex-shrink:0}
.profile-name{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:17px}
.profile-status{margin-top:6px;color:var(--text-2);font-size:14px}

.profile-box.border-neon{--frame:#00d8ff;--soft:rgba(0,216,255,.22);--bg:linear-gradient(135deg,#061924,#0d1f2d 35%,#ebfdff);border:3px solid var(--frame);box-shadow:0 0 0 2px rgba(0,216,255,.2),0 0 18px rgba(0,216,255,.45);background:var(--bg);border-radius:18px;}
.profile-box.border-gold{--frame:#d9a529;--soft:rgba(217,165,41,.18);--bg:linear-gradient(135deg,#fffef1,#fff5d0 35%,#f5d57a);border:3px solid var(--frame);box-shadow:0 0 0 2px rgba(217,165,41,.16),0 0 16px rgba(217,165,41,.32);background:var(--bg);border-radius:16px;}
.profile-box.border-gradient{--frame:#8b5cf6;--soft:rgba(139,92,246,.18);--bg:linear-gradient(135deg,#f8ecff,#eef4ff 35%,#f8f2ff);border:3px solid transparent;background-image:linear-gradient(#f8f8ff,#f8f8ff),linear-gradient(135deg,#ff8ec7,#7c7bff,#7ef7bf);background-origin:border-box;background-clip:padding-box,border-box;border-radius:18px;box-shadow:0 0 0 2px rgba(123,96,255,.12);}
.profile-box.border-vine,.profile-box.border-branch,.profile-box.border-thorn,.profile-box.border-spark,.profile-box.border-crystal,.profile-box.border-comet,.profile-box.border-ribbon,.profile-box.border-lotus,.profile-box.border-crown,.profile-box.border-wing,.profile-box.border-nova,.profile-box.border-spire{position:relative;overflow:hidden;border-radius:18px;}
.profile-box.border-vine{--frame:#2ea95e;--soft:rgba(46,169,94,.22);--bg:linear-gradient(135deg,#effff5,#f9fffb 38%,#edfef1);border:3px solid var(--frame);box-shadow:0 0 0 2px rgba(46,169,94,.12),0 0 14px rgba(46,169,94,.22);background:var(--bg);}
.profile-box.border-vine::before{content:"";position:absolute;inset:7px 10px 7px 10px;border-radius:16px;background:linear-gradient(135deg,rgba(46,169,94,.16),rgba(46,169,94,.02));clip-path:polygon(0 15%, 18% 0, 32% 12%, 48% 0, 65% 15%, 82% 0, 100% 16%, 100% 100%, 0 100%);}
.profile-box.border-branch{--frame:#7a4b1e;--soft:rgba(122,75,30,.18);--bg:linear-gradient(135deg,#faf0e6,#f9f8f3 44%,#f4e9dc);border:3px solid var(--frame);box-shadow:0 0 0 2px rgba(122,75,30,.1),0 0 16px rgba(122,75,30,.2);background:var(--bg);}
.profile-box.border-branch::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 18%,rgba(122,75,30,.16) 18% 22%,transparent 22% 48%,rgba(122,75,30,.16) 48% 52%,transparent 52% 100%);clip-path:polygon(0 8%, 12% 0, 28% 12%, 40% 0, 54% 18%, 70% 0, 82% 14%, 100% 0, 100% 100%, 0 100%);}
.profile-box.border-thorn{--frame:#b95fc6;--soft:rgba(185,95,198,.18);--bg:linear-gradient(135deg,#fff1ff,#fefcff 50%,#fff8ff);border:3px solid var(--frame);box-shadow:0 0 0 2px rgba(185,95,198,.12),0 0 18px rgba(185,95,198,.22);background:var(--bg);border-radius:22px 18px 20px 18px;transform:skewX(-1deg);}
.profile-box.border-thorn::before{content:"";position:absolute;inset:6px;border:2px solid rgba(185,95,198,.7);border-radius:18px 16px 18px 16px;clip-path:polygon(0 12%, 100% 0, 100% 100%, 0 88%, 15% 50%);}
.profile-box.border-spark{--frame:#ffb703;--soft:rgba(255,183,3,.18);--bg:linear-gradient(135deg,#fff7d6,#fffdf8 45%,#fff0b8);border:3px solid var(--frame);box-shadow:0 0 0 2px rgba(255,183,3,.12),0 0 18px rgba(255,183,3,.22);background:var(--bg);}
.profile-box.border-spark::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 12%, rgba(255,183,3,.9) 0 3px, transparent 4px),radial-gradient(circle at 75% 22%, rgba(255,183,3,.8) 0 3px, transparent 4px),radial-gradient(circle at 80% 80%, rgba(255,183,3,.8) 0 3px, transparent 4px),radial-gradient(circle at 28% 74%, rgba(255,183,3,.7) 0 2px, transparent 3px);}
.profile-box.border-crystal{--frame:#5da7ff;--soft:rgba(93,167,255,.18);--bg:linear-gradient(135deg,#edf9ff,#f9fbff 48%,#e7f5ff);border:3px solid var(--frame);box-shadow:0 0 0 2px rgba(93,167,255,.14),0 0 18px rgba(93,167,255,.22);background:var(--bg);clip-path:polygon(2% 20%, 18% 0, 82% 0, 98% 20%, 100% 80%, 82% 100%, 18% 100%, 0 80%);}
.profile-box.border-comet{--frame:#ff5d5d;--soft:rgba(255,93,93,.16);--bg:linear-gradient(135deg,#fff2f2,#fffdfd 48%,#ffe6e6);border:3px solid var(--frame);box-shadow:0 0 0 2px rgba(255,93,93,.12),0 0 16px rgba(255,93,93,.2);background:var(--bg);}
.profile-box.border-comet::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 0 55%,rgba(255,93,93,.22) 68%,transparent 82%);transform:skewX(-12deg);}
.profile-box.border-ribbon{--frame:#b35eff;--soft:rgba(179,94,255,.18);--bg:linear-gradient(135deg,#fef3ff,#fafaff 50%,#f5ebff);border:3px solid var(--frame);box-shadow:0 0 0 2px rgba(179,94,255,.12),0 0 16px rgba(179,94,255,.18);background:var(--bg);border-radius:24px 10px 24px 10px;}
.profile-box.border-ribbon::before{content:"";position:absolute;inset:0;border-radius:24px 10px 24px 10px;background:repeating-linear-gradient(135deg,rgba(179,94,255,.16),rgba(179,94,255,.16) 8px,transparent 8px,transparent 18px);}
.profile-box.border-lotus{--frame:#ff7ea6;--soft:rgba(255,126,166,.2);--bg:linear-gradient(135deg,#fff2f7,#fffdfd 52%,#ffe9f1);border:3px solid var(--frame);box-shadow:0 0 0 2px rgba(255,126,166,.12),0 0 18px rgba(255,126,166,.18);background:var(--bg);}
.profile-box.border-lotus::before{content:"";position:absolute;inset:8px 12px;border-radius:20px;background:radial-gradient(circle at 50% 50%, rgba(255,126,166,.42) 0 22%, transparent 23%),radial-gradient(circle at 25% 25%, rgba(255,126,166,.3) 0 16%, transparent 17%),radial-gradient(circle at 75% 25%, rgba(255,126,166,.3) 0 16%, transparent 17%),radial-gradient(circle at 25% 75%, rgba(255,126,166,.3) 0 16%, transparent 17%),radial-gradient(circle at 75% 75%, rgba(255,126,166,.3) 0 16%, transparent 17%);}
.profile-box.border-crown{--frame:#ffc93d;--soft:rgba(255,201,61,.18);--bg:linear-gradient(135deg,#fffbe6,#fffdfb 50%,#fff3c8);border:3px solid var(--frame);box-shadow:0 0 0 2px rgba(255,201,61,.12),0 0 18px rgba(255,201,61,.2);background:var(--bg);}
.profile-box.border-crown::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0 52%, rgba(255,201,61,.24) 52% 100%);clip-path:polygon(0 18%, 14% 18%, 24% 0, 36% 18%, 50% 0, 64% 18%, 76% 0, 86% 18%, 100% 18%, 100% 100%, 0 100%);}
.profile-box.border-wing{--frame:#32c7c8;--soft:rgba(50,199,200,.18);--bg:linear-gradient(135deg,#ebffff,#f8fffe 50%,#e5ffff);border:3px solid var(--frame);box-shadow:0 0 0 2px rgba(50,199,200,.1),0 0 18px rgba(50,199,200,.18);background:var(--bg);}
.profile-box.border-wing::before,.profile-box.border-wing::after{content:"";position:absolute;top:10px;bottom:10px;width:42%;background:linear-gradient(135deg,rgba(50,199,200,.18),rgba(50,199,200,.06));clip-path:polygon(0 50%, 100% 0, 100% 100%);}
.profile-box.border-wing::before{left:0;transform:scaleX(-1);}
.profile-box.border-wing::after{right:0;}
.profile-box.border-nova{--frame:#7d63ff;--soft:rgba(125,99,255,.2);--bg:linear-gradient(135deg,#f1eeff,#fffdfd 50%,#ecf0ff);border:3px solid var(--frame);box-shadow:0 0 0 2px rgba(125,99,255,.12),0 0 18px rgba(125,99,255,.18);background:var(--bg);}
.profile-box.border-nova::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at center, rgba(125,99,255,.2) 0 24%, transparent 25%),radial-gradient(circle at 20% 20%, rgba(255,255,255,.95) 0 2px, transparent 3px),radial-gradient(circle at 78% 30%, rgba(255,255,255,.95) 0 2px, transparent 3px),radial-gradient(circle at 35% 72%, rgba(255,255,255,.95) 0 2px, transparent 3px),radial-gradient(circle at 70% 70%, rgba(255,255,255,.95) 0 2px, transparent 3px);}
.profile-box.border-spire{--frame:#ff7a18;--soft:rgba(255,122,24,.18);--bg:linear-gradient(135deg,#fff3e8,#fffdfb 50%,#ffe9d6);border:3px solid var(--frame);box-shadow:0 0 0 2px rgba(255,122,24,.12),0 0 18px rgba(255,122,24,.2);background:var(--bg);}
.profile-box.border-spire::before{content:"";position:absolute;inset:0;clip-path:polygon(0 100%, 0 18%, 18% 18%, 18% 0, 32% 0, 32% 18%, 50% 18%, 50% 0, 64% 0, 64% 18%, 82% 18%, 82% 0, 100% 0, 100% 100%);background:linear-gradient(180deg,rgba(255,122,24,.18),rgba(255,122,24,.02));}

.avatar.border-neon{border:3px solid #00d8ff;box-shadow:0 0 0 2px rgba(0,216,255,.2),0 0 12px rgba(0,216,255,.45);border-radius:18px;background:linear-gradient(135deg,#1a2e40,#0f3a48 40%,#d9f9ff);}
.avatar.border-gold{border:3px solid #d9a529;box-shadow:0 0 0 2px rgba(217,165,41,.15),0 0 12px rgba(217,165,41,.28);border-radius:14px;background:linear-gradient(135deg,#fffdf5,#f6d678 50%,#d49d25);}
.avatar.border-gradient{border:3px solid transparent;background-image:linear-gradient(var(--main),var(--main)),linear-gradient(135deg,#ff8ec7,#7c7bff,#7ef7bf);background-origin:border-box;background-clip:padding-box,border-box;border-radius:18px;box-shadow:0 0 0 2px rgba(123,96,255,.12);}
.avatar.border-vine,.avatar.border-branch,.avatar.border-thorn,.avatar.border-spark,.avatar.border-crystal,.avatar.border-comet,.avatar.border-ribbon,.avatar.border-lotus,.avatar.border-crown,.avatar.border-wing,.avatar.border-nova,.avatar.border-spire{border:3px solid transparent;box-shadow:0 0 0 2px rgba(98,92,255,.1),0 0 12px rgba(98,92,255,.18);}
.avatar.border-vine{background-image:linear-gradient(var(--main),var(--main)),linear-gradient(135deg,#a8e6a8,#3bb273,#d1f4d4);background-origin:border-box;background-clip:padding-box,border-box;border-radius:16px 20px 18px 20px;}
.avatar.border-branch{background-image:linear-gradient(var(--main),var(--main)),linear-gradient(135deg,#d6b38b,#8c5b34,#f2d5a3);background-origin:border-box;background-clip:padding-box,border-box;border-radius:20px 12px 18px 12px;}
.avatar.border-thorn{background-image:linear-gradient(var(--main),var(--main)),linear-gradient(135deg,#f8d7ff,#b95fc6,#f5d0ff);background-origin:border-box;background-clip:padding-box,border-box;border-radius:18px 18px 24px 18px;transform:rotate(-3deg);}
.avatar.border-spark{background-image:linear-gradient(var(--main),var(--main)),linear-gradient(135deg,#fff3b0,#ffb703,#ffd166);background-origin:border-box;background-clip:padding-box,border-box;border-radius:14px;}
.avatar.border-crystal{background-image:linear-gradient(var(--main),var(--main)),linear-gradient(135deg,#dff7ff,#5da7ff,#a7d8ff);background-origin:border-box;background-clip:padding-box,border-box;clip-path:polygon(50% 0%, 100% 20%, 100% 80%, 50% 100%, 0 80%, 0 20%);}
.avatar.border-comet{background-image:linear-gradient(var(--main),var(--main)),linear-gradient(135deg,#ffd6d6,#ff5d5d,#ffb5b5);background-origin:border-box;background-clip:padding-box,border-box;border-radius:18px 12px 22px 12px;}
.avatar.border-ribbon{background-image:linear-gradient(var(--main),var(--main)),linear-gradient(135deg,#f3d4ff,#b35eff,#d7a8ff);background-origin:border-box;background-clip:padding-box,border-box;border-radius:16px 24px 16px 24px;}
.avatar.border-lotus{background-image:linear-gradient(var(--main),var(--main)),linear-gradient(135deg,#ffdfe9,#ff7ea6,#b8f2ea);background-origin:border-box;background-clip:padding-box,border-box;border-radius:50% 50% 40% 40%;}
.avatar.border-crown{background-image:linear-gradient(var(--main),var(--main)),linear-gradient(135deg,#fff7cc,#ffc93d,#ffd36b);background-origin:border-box;background-clip:padding-box,border-box;clip-path:polygon(0 100%, 0 30%, 22% 30%, 30% 0, 44% 30%, 56% 0, 70% 30%, 78% 30%, 100% 30%, 100% 100%);}
.avatar.border-wing{background-image:linear-gradient(var(--main),var(--main)),linear-gradient(135deg,#d9fffb,#32c7c8,#9ce9ef);background-origin:border-box;background-clip:padding-box,border-box;clip-path:polygon(0 50%, 30% 18%, 50% 0, 70% 18%, 100% 50%, 70% 82%, 50% 100%, 30% 82%);}
.avatar.border-nova{background-image:linear-gradient(var(--main),var(--main)),linear-gradient(135deg,#dad4ff,#7d63ff,#b8b3ff);background-origin:border-box;background-clip:padding-box,border-box;border-radius:50%;box-shadow:0 0 18px rgba(125,99,255,.24);} 
.avatar.border-spire{background-image:linear-gradient(var(--main),var(--main)),linear-gradient(135deg,#ffe8d1,#ff7a18,#ffd39a);background-origin:border-box;background-clip:padding-box,border-box;clip-path:polygon(50% 0%, 100% 100%, 80% 100%, 80% 58%, 20% 58%, 20% 100%, 0 100%);}
/* 네온 테두리는 배경이 어두워서 글자를 밝게 */
.profile-box.border-neon{color:#e6f9ff}
.profile-box.border-neon .meta,.profile-box.border-neon .profile-status{color:rgba(230,249,255,.78)}

.handle-link{cursor:pointer}
.handle-link:hover{color:var(--main);text-decoration:underline}

/* ---------- 시간표 / 급식 ---------- */
.date-nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.date-nav strong{min-width:118px;text-align:center;font-size:13px;font-weight:600;color:var(--text-2)}
.date-nav .outline{min-height:28px;padding:0 8px;border-radius:8px;font-size:12px}
.timetable-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.timetable-row + .timetable-row{border-top:1px solid var(--border)}
.meal-block + .meal-block{margin-top:14px}
.meal-list{margin:6px 0 0;padding-left:18px;line-height:1.9}
.allergy{margin-left:4px;color:var(--muted);font-size:12px}
.meal-page-card{max-width:620px}

/* ---------- 배지 ---------- */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;background:#eef0f3;color:var(--text-2);font-size:11px;font-weight:700;line-height:1.6;white-space:nowrap;vertical-align:middle}
.badge-admin{background:var(--danger-soft);color:#c62f35}
.badge-teacher{background:var(--warn-soft);color:var(--warn)}
.badge-student{background:var(--light);color:var(--main)}
.badge-title{background:#f3ecff;color:#7c3aed}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-accent{background:var(--light);color:var(--main)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-muted{background:var(--surface-2);color:var(--muted)}

/* ---------- 홈 ---------- */
.home-hello{margin-bottom:20px}
.home-hello h1{margin:0 0 4px;font-size:24px;font-weight:800}
.home-hello p{margin:0;color:var(--muted);font-size:14px}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.dday-row{display:flex;gap:10px;margin-bottom:16px;padding-bottom:2px;overflow-x:auto;scrollbar-width:none}
.dday-row::-webkit-scrollbar{display:none}
.dday-card{flex:0 0 172px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.dday-card:hover{border-color:var(--main)}
.dday-num{font-size:20px;font-weight:800;color:var(--main)}
.dday-num.urgent{color:var(--danger)}
.dday-label{margin-top:2px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dday-type{margin-top:2px;color:var(--muted);font-size:12px}
.rank-group + .rank-group{margin-top:14px}
.rank-group-title{margin-bottom:2px;color:var(--muted);font-size:12px;font-weight:600}
.leaderboard-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.leaderboard-row + .leaderboard-row{border-top:1px solid var(--border)}
.leaderboard-row.clickable{cursor:pointer}
.leaderboard-row.clickable:hover{color:var(--main)}

/* ---------- 친구들 ---------- */
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.student-card{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);text-align:left;transition:border-color .15s,transform .15s}
.student-card:hover{border-color:var(--main);transform:translateY(-1px)}
.student-card .avatar{width:42px;height:42px;font-size:14px}
.student-info{display:flex;flex-direction:column;gap:1px;min-width:0}
.student-name{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:15px}
.student-status{margin-top:2px;color:var(--text-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#eef0f3;color:var(--text-2);font-size:12px;font-weight:800}
.rank-badge.rank-1{background:#fff3cd;color:#8a6d00}
.rank-badge.rank-2{background:#e9ecef;color:#495057}
.rank-badge.rank-3{background:#f3e0d0;color:#8a4b00}

/* ---------- 안내 띠 ---------- */
.notify-banner{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;border-radius:var(--radius);background:var(--light);color:var(--dark);font-size:14px}
.lock-banner{margin-bottom:16px;padding:12px 16px;border-radius:var(--radius);background:var(--danger-soft);color:#c62f35;font-size:14px;font-weight:600}
.feed-warning{margin-top:12px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--danger-soft);color:#c62f35;font-size:13px}

/* ---------- 게시판 ---------- */
.board{overflow:hidden}
.board-head,.board-row{display:grid;grid-template-columns:56px minmax(0,1fr) 130px 64px 52px 52px;align-items:center;gap:10px;padding:0 18px}
.board-head{height:42px;border-bottom:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-size:13px;font-weight:600}
.board-row{padding-top:13px;padding-bottom:13px;cursor:pointer;transition:background .12s}
.board-row + .board-row{border-top:1px solid var(--border)}
.board-row:hover{background:var(--surface-2)}
.c-no,.c-date,.c-num{text-align:center;color:var(--muted);font-size:13px}
.board-head .c-no,.board-head .c-date,.board-head .c-num{color:var(--text-2)}
.c-num.liked{color:var(--main);font-weight:700}
.c-title{display:flex;align-items:center;gap:6px;min-width:0}
.c-title-text{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-row:hover .c-title-text{color:var(--main)}
.c-author{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.comment-count{flex-shrink:0;color:var(--main);font-size:13px;font-weight:700}
.board-mobile-meta{display:none}
.board-tabs{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:#eceef1}
.board-tab{padding:6px 12px;border:0;border-radius:8px;background:none;color:var(--text-2);font-size:13px;font-weight:600}
.board-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.search-input{width:240px;max-width:100%}
.pagination{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:16px}
.page-btn{min-width:34px;height:34px;padding:0 8px;border:1px solid transparent;border-radius:8px;background:none;color:var(--text-2);font-size:14px}
.page-btn:hover{background:var(--surface)}
.page-btn.active{border-color:var(--border-strong);background:var(--surface);color:var(--text);font-weight:700}

.back-btn{margin:0 0 10px -10px}
.post{padding:28px 30px}
.post-title{margin:0 0 12px;font-size:24px;font-weight:800;word-break:break-word}
.post > .badge{margin-bottom:10px}
.post-meta{display:flex;align-items:center;gap:4px 12px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--border);color:var(--muted);font-size:13px}
.post-author{display:inline-flex;align-items:center;gap:4px;color:var(--text);font-size:14px}
.post-body{padding:22px 0 4px;font-size:16px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.post-like{display:flex;justify-content:center;margin:28px 0 4px}
.like-btn{display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:96px;padding:12px 18px;border:1px solid var(--border-strong);border-radius:16px;background:var(--surface);color:var(--text-2);font-size:13px;font-weight:600;transition:background .15s,border-color .15s,color .15s}
.like-icon{font-size:24px;line-height:1.1;filter:grayscale(1);opacity:.6;transition:filter .15s,opacity .15s}
.like-btn:hover{border-color:var(--main)}
.like-btn.active{border-color:var(--main);background:var(--light);color:var(--main)}
.like-btn.active .like-icon{filter:none;opacity:1}
.like-btn:disabled{opacity:.6;cursor:wait}
.post-actions{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.comments{margin-top:16px}
.comment-total{color:var(--main)}
.comment{padding:14px 0}
.comment + .comment{border-top:1px solid var(--border)}
.comment-head{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;font-size:14px}
.comment-body{margin-top:4px;white-space:pre-wrap;word-break:break-word}
.comment-del{margin-left:auto;padding:2px 6px;border:0;background:none;color:var(--muted);font-size:12px}
.comment-del:hover{color:var(--danger)}
.comment-form{display:flex;gap:8px;align-items:stretch;margin-top:12px;padding-top:16px;border-top:1px solid var(--border)}
.comment-form textarea{flex:1;min-height:46px;height:46px;resize:vertical}
.comment-form .primary{min-height:46px}

.feed-post-embed{max-width:480px;margin-top:12px}
.feed-post-embed img{display:block;max-width:100%;border:1px solid var(--border);border-radius:12px}
.feed-post-embed iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.video-placeholder{position:relative;max-width:480px;aspect-ratio:16/9;margin-top:12px;border-radius:12px;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
.video-placeholder img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
.video-placeholder button{position:relative;z-index:1;padding:9px 18px;border:0;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;font-weight:700}
.link-card{display:block;margin-top:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);color:var(--text-2);font-size:13px;text-decoration:none;word-break:break-all}
.link-card:hover{border-color:var(--border-strong)}
.link-card b{display:block;margin-bottom:2px;color:var(--main);font-size:13px}

/* ---------- 게임 ---------- */
.games-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.game-card{display:flex;flex-direction:column;padding:20px;transition:transform .15s,box-shadow .15s}
.game-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(16,24,40,.08)}
.game-icon{width:52px;height:52px;margin-bottom:14px;display:flex;justify-content:center;align-items:center;border-radius:14px;background:var(--surface-2);font-size:28px}
.game-card h3{margin:0 0 4px;font-size:16px}
.game-card p{flex:1;margin:0 0 16px;color:var(--text-2);font-size:14px}
.game-link{display:flex;align-items:center;justify-content:center;min-height:38px;border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);font-size:14px;font-weight:600;text-decoration:none}
.game-link:hover{background:var(--light);color:var(--main)}
.game-note{margin-bottom:16px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text-2);font-size:13px}

/* ---------- 계정 / 상점 ---------- */
.account-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.shop-section h4{margin:22px 0 10px;color:var(--text-2);font-size:14px}
.shop-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.shop-item{display:flex;flex-direction:column;align-items:center;padding:16px 12px;text-align:center;box-shadow:none}
.shop-item .icon{margin-bottom:6px;font-size:26px}
.shop-item .name{flex:1;margin-bottom:4px;font-size:13px;font-weight:700}
.shop-item .price{margin-bottom:10px;color:var(--warn);font-size:13px;font-weight:600}
.shop-item button{width:100%}
.shop-item.owned{background:var(--surface-2)}
.shop-more{grid-column:1/-1;text-align:center}
.nickname-color-input{width:100%;height:36px;margin-bottom:8px;padding:2px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface)}

/* ---------- 로딩 / 토스트 ---------- */
.spinner-row{padding:64px 20px;text-align:center;color:var(--muted);font-size:14px}
.spinner-row::before{content:"";display:block;width:26px;height:26px;margin:0 auto 12px;border:3px solid var(--border);border-top-color:var(--main);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#toastHost{position:fixed;left:50%;bottom:24px;z-index:10010;display:flex;flex-direction:column;align-items:center;gap:8px;width:calc(100% - 32px);max-width:420px;transform:translateX(-50%);pointer-events:none}
.toast{padding:12px 16px;border-radius:12px;background:#1f2937;color:#fff;font-size:14px;line-height:1.5;white-space:pre-line;box-shadow:var(--shadow-lg);pointer-events:auto;cursor:pointer;animation:toast-in .2s ease-out}
.toast.hide{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}}

/* ---------- 반응형 ---------- */
@media(max-width:860px){
  .home-grid{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(3,1fr)}
  .games-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:640px){
  .top{padding:10px 16px 2px}

    const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");

   apiKey에 넣어주세요.
========================================================= */

const NEIS_CONFIG={
  atptOfcdcScCode:"J10",   // 경기도교육청
  sdSchulCode:"7681004",   // 교하중학교
  grade:"1",
  classNm:"3",

};
const NEIS_CACHE_KEY="neis_cache_v2";

const ALLERGY_NAMES={
  1:"난류",2:"우유",3:"메밀",4:"땅콩",5:"대두",6:"밀",7:"고등어",8:"게",9:"새우",10:"돼지고기",
  11:"복숭아",12:"토마토",13:"아황산류",14:"호두",15:"닭고기",16:"쇠고기",17:"오징어",18:"조개류",19:"잣"
};

const neisMemoryCache=new Map();
let mealDate=today();
let timetableDate=today();

// 예전 버전이 남긴 localStorage 값 정리
["neis_school_config_v1","neis_meal_cache_v1","neis_timetable_cache_v1"].forEach(key=>{
  try{ localStorage.removeItem(key); }catch(e){}
});

async function neisRequest(service,params){
  const query=new URLSearchParams({
    Type:"json", pSize:"100",
    ATPT_OFCDC_SC_CODE:NEIS_CONFIG.atptOfcdcScCode,
    SD_SCHUL_CODE:NEIS_CONFIG.sdSchulCode,
    ...params
  });
  if(NEIS_CONFIG.apiKey) query.set("KEY",NEIS_CONFIG.apiKey);

  const response=await fetch(`https://open.neis.go.kr/hub/${service}?${query}`);
  if(!response.ok) throw new Error(`NEIS ${service} 호출 실패 (${response.status})`);
  const json=await response.json();
  // 데이터가 없거나 오류면 {RESULT:{CODE,MESSAGE}}만 옵니다.
  if(json.RESULT){
    if(json.RESULT.CODE==="INFO-200") return [];
    throw new Error(json.RESULT.MESSAGE);
  }
  return json[service]?.[1]?.row || [];
}

// 날짜별로 메모리 + localStorage에 저장. 실패하면 같은 날짜의 저장본만 사용합니다.
async function loadNeisDay(kind,dateStr,loader){
  const cacheKey=`${kind}:${dateStr}`;
  if(neisMemoryCache.has(cacheKey)) return neisMemoryCache.get(cacheKey);

  let stored={};
  try{ stored=JSON.parse(localStorage.getItem(NEIS_CACHE_KEY)||"{}") || {}; }catch(e){}

  try{
    const result={date:dateStr, data:await loader(dateStr.replace(/-/g,""))};
    neisMemoryCache.set(cacheKey,result);

    delete stored[cacheKey];
    stored[cacheKey]=result.data;
    const keys=Object.keys(stored);
    keys.slice(0,Math.max(0,keys.length-NEIS_CACHE_LIMIT)).forEach(key=>delete stored[key]);
    try{ localStorage.setItem(NEIS_CACHE_KEY,JSON.stringify(stored)); }catch(e){}

    return result;
  }catch(e){
    console.warn(`NEIS ${kind} 불러오기 실패`,e);
    if(stored[cacheKey]) return {date:dateStr, data:stored[cacheKey], offline:true};
    return {date:dateStr, data:null, error:true};
  }
}

function splitNeisLines(text){

// "목살스테이크*소스 (1.2.5.6)" → 메뉴 이름과 알레르기 번호 분리
function parseDish(text){
  const match=text.match(/^(.*?)\s*\(([\d.\s]+)\)\s*$/);
  if(!match) return {name:text, allergies:[]};
  return {name:match[1].trim(), allergies:match[2].split(".").map(s=>s.trim()).filter(Boolean)};
}

      calories:row.CAL_INFO || "",
      dishes:splitNeisLines(row.DDISH_NM).map(parseDish)
    }));
  });
}

function fetchTimetable(dateStr){
  return loadNeisDay("timetable",dateStr,async ymd=>{
    const rows=await neisRequest("misTimetable",{
      ALL_TI_YMD:ymd, GRADE:NEIS_CONFIG.grade, CLASS_NM:NEIS_CONFIG.classNm
    });
    const byPeriod=new Map();
    rows.forEach(row=>{
      const period=Number(row.PERIO);
      const subject=String(row.ITRT_CNTNT||"").replace(/^[-*\s]+/,"").trim();
      if(period && subject && !byPeriod.has(period)) byPeriod.set(period,subject);
    });
    return [...byPeriod].sort((a,b)=>a[0]-b[0]).map(([period,subject])=>({period,subject}));
  });
}

        <strong>${escapeHTML(schoolDateLabel(dateStr))}</strong>
        <button class="outline" onclick="${changeFn}(1)" aria-label="다음 날">▶</button>
        ${dateStr!==today() ? `<button class="outline" onclick="${changeFn}(0)">오늘</button>` : ""}
      </div>
    </div>

}

function neisStatusMessage(result,what){
  if(result.loading) return `<p class="meta">불러오는 중...</p>`;
  if(result.error) return `<p class="meta">${what} 정보를 불러오지 못했어요. 잠시 후 다시 시도해주세요.</p>`;
  if(!result.data.length) return `<p class="meta">이 날은 ${what} 정보가 없어요. (주말·공휴일·방학일 수 있어요)</p>`;
  return "";
}

function renderTimetableCard(result){

  return `

      ? `<p class="meta">※ NEIS 인증키가 없어 5교시까지만 표시될 수 있어요.</p>` : ""}

function renderMealCard(result){
  const status=neisStatusMessage(result,"급식");
  return `
    ${neisCardHeader("🍚 급식","changeMealDate",result.date)}
    ${result.offline ? `<p class="meta">⚠️ 연결이 안 돼서 저장해 둔 급식을 보여주고 있어요.</p>` : ""}
    ${status || result.data.map(meal=>`
      <div class="meal-block">
        <div class="meta">${escapeHTML(meal.type)}${meal.calories ? ` · ${escapeHTML(meal.calories)}` : ""}</div>

async function fillNeisCard(cardId,dateStr,fetcher,renderer){
  const card=document.getElementById(cardId);
  if(!card) return;
  card.dataset.date=dateStr;
  card.innerHTML=renderer({date:dateStr, loading:true});

  const result=await fetcher(dateStr);
  // 불러오는 사이 날짜를 바꿨거나 다른 페이지로 갔으면 무시
  const current=document.getElementById(cardId);
  if(current && current.dataset.date===dateStr) current.innerHTML=renderer(result);
}

function changeMealDate(n){

/* =========================================================
   공통 HELPERS
========================================================= */

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function formatDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function today(){ return formatDate(new Date()); }

// alert 대신 화면 아래에 잠깐 떴다 사라지는 메시지 (누르면 바로 닫힘)
function msg(text){
  const host=document.getElementById("toastHost");
  if(!host){ alert(text); return; }
  const toast=document.createElement("div");
  toast.className="toast";
  toast.textContent=text;
  toast.onclick=()=>toast.remove();
  host.appendChild(toast);
  const duration=Math.min(8000,2600+String(text).length*40);
  setTimeout(()=>toast.classList.add("hide"),duration);
  setTimeout(()=>toast.remove(),duration+400);
}
function openModal(html){ document.getElementById("modalContent").innerHTML=html; document.getElementById("modalBg").style.display="flex"; }
function closeModal(){ document.getElementById("modalBg").style.display="none"; }
function showLoading(){ document.getElementById("app").innerHTML=`<div class="spinner-row">불러오는 중...</div>`; }
function showError(text){
  document.getElementById("app").innerHTML=`<div class="card list-empty">불러오지 못했어요.<br><span class="meta">${escapeHTML(text)}</span></div>`;
}

function isStaff(){ return Boolean(profile && (profile.role==="admin" || profile.role==="teacher")); }
function canDelete(authorId){ return Boolean(isStaff() || currentUser?.id===authorId); }

function isEditedRecord(row){
  if(!row) return false;
  const created=row.created_at;
  const updated=row.updated_at || row.edited_at;
  if(!created || !updated) return false;
  return new Date(updated).getTime() !== new Date(created).getTime();
}

// DB 시각(UTC)을 한국 시간으로 바꿔서 표시
function parseDate(value){
  const d=new Date(value);
  return Number.isNaN(d.getTime()) ? null : d;
}

function fmtDay(value){
  const d=parseDate(value);
  return d ? formatDate(d) : String(value||"").slice(0,10);
}

function fmtDateTime(value){
  const d=parseDate(value);
  if(!d) return String(value||"").slice(0,16).replace("T"," ");
  return `${formatDate(d)} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

// 게시판 목록용: 오늘 쓴 글은 시각, 그 외는 월.일
function shortDate(value){
  const d=parseDate(value);
  if(!d) return "";
  if(formatDate(d)===today()) return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  return `${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
}

function formatMetaTimestamp(row){
  if(!row?.created_at) return "";
  const stamp=fmtDateTime(row.created_at);
  return isEditedRecord(row) ? `${stamp} (수정됨)` : stamp;
}

    counts[table]=count||0;

function applyEquippedStyles(){

  const fontItem=FONT_ITEMS.find(f=>f.id===profile?.equipped_font);

}

function daysUntil(dateStr){
  const target=new Date(dateStr+"T00:00:00");
  const now=new Date();
  now.setHours(0,0,0,0);
  return Math.ceil((target-now)/(1000*60*60*24));
}

function ddayLabel(diff){
  if(diff===0) return "D-DAY";
  if(diff>0) return `D-${diff}`;
  return `D+${Math.abs(diff)}`;
}

function ddayBadge(dateStr){
  const diff=daysUntil(dateStr);
  if(diff<0) return `<span class="badge badge-muted">지남</span>`;
  return `<span class="badge ${diff<=3?"badge-danger":"badge-accent"}">${ddayLabel(diff)}</span>`;
}

// 목록 왼쪽에 붙는 날짜 칸 (10월 / 29 / 목)
function dateTile(dateStr){
  const d=new Date(`${dateStr}T00:00:00`);
  return `
    <div class="date-tile">
      <span class="m">${d.getMonth()+1}월</span>
      <span class="d">${d.getDate()}</span>
      <span class="w">${"일월화수목금토"[d.getDay()]}</span>
    </div>
  `;
}

async function login(){
  const studentId=document.getElementById("loginId").value.trim();
  const password=document.getElementById("loginPassword").value;

  if(!STUDENT_IDS.includes(studentId)){ msg("존재하지 않는 학번입니다."); return; }
  if(!password){ msg("비밀번호를 입력해주세요."); return; }

  const {data,error}=await supabase.auth.signInWithPassword({email:idToEmail(studentId),password});
  if(error){ msg("학번 또는 비밀번호가 올바르지 않습니다."); return; }

  currentUser=data.user;
  await loadProfile();
  await updateLastLoginStamp();
  await loadProfile();

  if(!profile){
    msg("프로필을 불러오지 못했습니다. 관리자에게 문의해주세요.");
    await supabase.auth.signOut();
    currentUser=null;
    return;
  }

  document.getElementById("loginPage").style.display="none";
  applyEquippedStyles();
  await loadSettings();
  renderUserInfo();
  go("home");

  await tryDailyCheckin();
  await initExamNotifications();
}

async function logout(){
  await supabase.auth.signOut();
  currentUser=null;
  profile=null;
  document.getElementById("loginPage").style.display="flex";
  document.getElementById("loginId").value="";
  document.getElementById("loginPassword").value="";
}

async function updateLastLoginStamp(){
  if(!currentUser) return;
  // 기기 시계가 아니라 서버 시계로 기록합니다. (db-fixes.sql을 한 번 실행해야 동작)
  const {error}=await supabase.rpc("touch_last_login");
  if(error){
    console.warn("마지막 접속 시각 기록 실패 (db-fixes.sql 실행 필요):", error.message);
  }
}

async function loadProfile(){
  if(!currentUser)return;
  const {data,error}=await supabase.from("profiles").select("*").eq("id",currentUser.id).single();
  if(error){ console.error(error); profile=null; return; }
  profile=data;
}

async function restoreLogin(){
  const {data}=await supabase.auth.getSession();
  if(!data.session){ document.getElementById("loginPage").style.display="flex"; return; }

  currentUser=data.session.user;
  await loadProfile();
  await updateLastLoginStamp();
  await loadProfile();

  if(!profile){
    await supabase.auth.signOut();
    currentUser=null;
    document.getElementById("loginPage").style.display="flex";
    return;
  }

  document.getElementById("loginPage").style.display="none";
  applyEquippedStyles();
  await loadSettings();
  renderUserInfo();
  go("home");

  await tryDailyCheckin();
  await initExamNotifications();
}


/* =========================================================
   앱 전역 설정 (SNS 잠금 등)
   ⚠️ supabase에 "app_settings" 테이블(id int8, sns_locked bool)이
   필요하며, id=1 행이 하나 있어야 합니다. 관리자만 UPDATE 가능하도록
   RLS를 설정해주세요. 테이블이 없으면 잠금 기능은 항상 꺼짐 상태로 동작합니다.

   토글이 반응하지 않을 때 체크할 것:
   1) app_settings 테이블/컬럼(id int8, sns_locked bool)이 실제로 있는지
   2) id=1 행이 미리 한 줄 들어있는지 (없으면 upsert가 실패할 수 있음)
   3) profiles.role 값이 정확히 'admin' 문자열인지 (공백/오타 확인)
   4) admin이 app_settings를 UPDATE/INSERT 할 수 있도록 RLS 정책이
      설정되어 있는지 (SELECT만 허용되어 있으면 버튼을 눌러도 반영되지 않음)
========================================================= */

async function loadSettings(){
  const {data,error}=await supabase.from("app_settings").select("*").eq("id",1).maybeSingle();
  if(error){ console.warn("app_settings 로드 실패 (테이블/RLS 확인 필요):",error); }
  if(error || !data){ appSettings={sns_locked:false}; return; }
  appSettings=data;
}

async function toggleSnsLock(){
  if(!profile || profile.role!=="admin")return;
  const next=!appSettings.sns_locked;
  if(!confirm(next ? "게시판을 잠글까요? 학생들이 글쓰기와 댓글을 할 수 없게 됩니다." : "게시판 잠금을 풀까요?"))return;

  const {error}=await supabase.from("app_settings").upsert({id:1,sns_locked:next});
  if(error){
    console.error("SNS 잠금 변경 실패:",error);
    msg("설정 변경 실패: "+error.message+"\n(app_settings 테이블/RLS 정책을 확인해주세요. 콘솔에 자세한 오류가 출력되었습니다.)");
    return;
  }

  // 반영이 제대로 됐는지 서버에서 다시 확인 (RLS로 인해 조용히 실패하는 경우 방지)
  await loadSettings();
  if(appSettings.sns_locked!==next){
    msg("설정이 저장되지 않은 것 같습니다. 관리자 권한/RLS 정책을 확인해주세요.");
    return;
  }

  renderUserInfo();

  const activeBtn=document.querySelector('.nav-btn.active');
  if(activeBtn && activeBtn.dataset.page==="feed") renderFeed();
}

/* =========================================================
   📅 시험/수행평가 임박 알림
   - 브라우저 Notification API 사용 (탭/앱이 열려있을 때 동작)
   - 완전한 백그라운드 푸시(앱을 꺼도 오는 알림)를 원한다면
     Service Worker + Push API + 서버(Edge Function 등)의 예약 발송이
     추가로 필요합니다. 이 함수는 로그인 시점에 다가오는 시험을
     체크해서 로컬 알림을 띄워주는 "1차" 기능입니다.
========================================================= */

function getNotifiedDates(){
  try{
    return JSON.parse(localStorage.getItem(EXAM_NOTIFY_STORAGE_KEY)||"[]");
  }catch(e){
    return [];
  }
}

function markNotified(keys){
  try{
    const existing=getNotifiedDates();
    localStorage.setItem(EXAM_NOTIFY_STORAGE_KEY,JSON.stringify([...new Set([...existing,...keys])]));
  }catch(e){ /* localStorage 사용 불가 시 무시 */ }
}

function getNotificationPermissionState(){
  if(typeof window==="undefined" || !("Notification" in window)) return "unsupported";
  return Notification.permission;
}

/* =========================================================
   🔔 백그라운드 푸시 (사이트를 꺼도 오는 알림)
   서버가 필요해서 push-setup.md 순서대로 설정해야 합니다.
   VAPID_PUBLIC_KEY가 비어 있으면 이 기능은 꺼지고, 예전처럼
   사이트를 열어둔 동안만 알림이 옵니다.
========================================================= */

const VAPID_PUBLIC_KEY="";

function urlBase64ToUint8Array(base64){
  const padded=(base64+"=".repeat((4-base64.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/");
  return Uint8Array.from(atob(padded),c=>c.charCodeAt(0));
}

function isIosBrowserTab(){
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  const standalone=window.navigator.standalone===true || window.matchMedia("(display-mode: standalone)").matches;
  return ios && !standalone;
}

async function currentPushSubscription(){
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    return reg ? await reg.pushManager.getSubscription() : null;
  }catch(e){ return null; }
}

// "unconfigured" | "unsupported" | "needs-install" | "denied" | "on" | "off"
async function getPushState(){
  if(!VAPID_PUBLIC_KEY) return "unconfigured";
  if(isIosBrowserTab()) return "needs-install";
  if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return "unsupported";
  if(Notification.permission==="denied") return "denied";
  return (await currentPushSubscription()) ? "on" : "off";
}

function refreshNotifyUI(){
  if(["home","account"].includes(activePage())) render(activePage());
}

async function enablePush(){
  const state=await getPushState();
  if(state==="unconfigured"){ await initExamNotifications(); refreshNotifyUI(); return; }
  if(state==="needs-install"){ msg("아이폰은 사파리 공유 버튼 → '홈 화면에 추가'로 설치한 뒤, 설치된 앱에서 켜주세요."); return; }
  if(state==="unsupported"){ msg("이 브라우저는 백그라운드 알림을 지원하지 않아요."); return; }

  const permission=Notification.permission==="granted" ? "granted" : await Notification.requestPermission();
  if(permission!=="granted"){
    msg("알림이 허용되지 않았어요. 브라우저 설정에서 이 사이트의 알림을 허용해주세요.");
    refreshNotifyUI();
    return;
  }

  try{
    const reg=await Promise.race([
      navigator.serviceWorker.ready,
      new Promise((_,reject)=>setTimeout(()=>reject(new Error("서비스 워커가 준비되지 않았어요. 사이트가 https 주소인지 확인해주세요.")),6000))
    ]);
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
    }
    const json=sub.toJSON();
    const {error}=await supabase.from("push_subscriptions").upsert(
      {endpoint:json.endpoint, user_id:currentUser.id, p256dh:json.keys.p256dh, auth:json.keys.auth},
      {onConflict:"endpoint"}
    );
    if(error) throw error;
    msg("✅ 이제 사이트를 꺼도 시험·수행평가 알림이 와요!");

async function disablePush(){
  try{
    const sub=await currentPushSubscription();
    if(sub){
      await supabase.from("push_subscriptions").delete().eq("endpoint",sub.endpoint);
      await sub.unsubscribe();
    }
    msg("백그라운드 알림을 껐어요.");
  }catch(e){
    console.error(e);
    msg("알림을 끄지 못했어요: "+(e.message||e));
  }
  refreshNotifyUI();
}

async function initExamNotifications(){
  if(!("Notification" in window))return;

  // 백그라운드 푸시를 켠 기기는 서버가 알려주므로, 여기서 또 띄우면 중복됩니다
  if((await getPushState())==="on") return;

  const before=Notification.permission;
  if(before==="default"){
    try{ await Notification.requestPermission(); }catch(e){ /* 무시 */ }
  }

  // 권한 상태가 바뀌었으면 알림 안내가 보이는 페이지만 새로 그림
  // (예전엔 여기서 무조건 계정 페이지를 그려서, 로그인하면 홈 대신 계정 페이지가 떴음)
  if(Notification.permission!==before && ["home","account"].includes(activePage())){
    render(activePage());
  }

  if(Notification.permission!=="granted")return;

  const in3days=new Date();
  in3days.setDate(in3days.getDate()+EXAM_NOTIFY_DAYS);
  const untilStr=`${in3days.getFullYear()}-${String(in3days.getMonth()+1).padStart(2,"0")}-${String(in3days.getDate()).padStart(2,"0")}`;

  const {data,error}=await supabase
    .from("assignments")
    .select("*")
    .gte("event_date",today())
    .lte("event_date",untilStr);

  if(error || !data || !data.length)return;

  const notifiedDates=getNotifiedDates();
  const newlyNotified=[];

  data.forEach(a=>{
    const key=`${a.id}-${a.event_date}`;
    if(notifiedDates.includes(key))return;

    const diff=daysUntil(a.event_date);
    try{
      new Notification(`📝 수행평가/시험 임박: ${a.subject}`,{
        body:`${a.title} · ${ddayLabel(diff)} (${a.event_date})`,
        tag:key
      });
    }catch(e){ /* 알림 생성 실패 시 무시 */ }

    newlyNotified.push(key);
  });

  if(newlyNotified.length) markNotified(newlyNotified);
}

async function renderCalendar(){
  showLoading();
  const y=calendarDate.getFullYear();
  const m=calendarDate.getMonth();
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  const mm=String(m+1).padStart(2,"0");
  const start=`${y}-${mm}-01`;
  const end=`${y}-${mm}-${String(last.getDate()).padStart(2,"0")}`;

  const [schedulesResult,assignmentsResult]=await Promise.all([
    supabase.from("schedules").select("*").gte("event_date",start).lte("event_date",end),
    supabase.from("assignments").select("*").gte("event_date",start).lte("event_date",end)
  ]);
  const schedules=schedulesResult.data||[];
  const assignments=assignmentsResult.data||[];
  const todayStr=today();

  let cells="";
  for(let i=0;i<first.getDay();i++) cells+=`<div class="day empty-day"></div>`;

  for(let d=1;d<=last.getDate();d++){
    const date=`${y}-${mm}-${String(d).padStart(2,"0")}`;
    const weekday=new Date(y,m,d).getDay();
    const dayClass=`${date===todayStr?"today":""} ${weekday===0?"sun":weekday===6?"sat":""}`;
    cells+=`
      <div class="day ${dayClass}">
        <span class="day-num">${d}</span>

          ${cells}
        </div>
      </div>
      <div class="calendar-legend"><span><i class="dot"></i>일정</span><span><i class="dot assignment"></i>수행평가</span></div>
    </div>

    <h3 class="sub-heading">${m+1}월 일정 목록</h3>
    <div class="list">
      ${monthEvents.length ? monthEvents.map(e=>`
        <div class="list-item">

async function renderVotes(){
  showLoading();
  const {data,error}=await supabase.from("votes").select(`*, profiles(nickname,handle), vote_options(*)`).order("created_at",{ascending:false});
  if(error){ showError(error.message); return; }

  const voteIds=data.map(v=>v.id);
  let responses=[];
  if(voteIds.length){
    const result=await supabase.from("vote_responses").select("vote_id,option_id,user_id").in("vote_id",voteIds);
    if(result.error){ showError(result.error.message); return; }
    responses=result.data||[];
  }

  document.getElementById("app").innerHTML=`
    <div class="page-title"><h1>투표</h1><p>우리 반의 의견을 함께 정해요.</p></div>
    ${isStaff() ? `
      <div class="toolbar">
        <span class="toolbar-count">관리자와 선생님만 투표를 만들 수 있어요.</span>
        <button class="primary" onclick="voteForm()">+ 투표 만들기</button>
      </div>` : ""}
    ${data.length ? data.map(v=>renderVoteCard(v,responses)).join("") : `<div class="card list-empty">등록된 투표가 없습니다.</div>`}
  `;
}

function sortedVoteOptions(v){
  return [...(v.vote_options||[])].sort((a,b)=>a.id-b.id);
}

function renderVoteCard(v,responses){
  const myVote=responses.find(r=>r.vote_id===v.id && r.user_id===currentUser.id);
  const total=responses.filter(r=>r.vote_id===v.id).length;
  const expired=v.expires_at && new Date(v.expires_at)<new Date();
  const active=v.is_active!==false && !expired;
  const showResults=Boolean(myVote)||!active;

  return `
    <div class="poll">
      <div class="poll-head">
        <div>
          <h3>${escapeHTML(v.title)}</h3>
          <div class="meta">${authorLabel(v.profiles,v.author_id)} · ${total}명 참여${v.expires_at ? ` · 마감 ${fmtDateTime(v.expires_at)}` : ""}</div>
        </div>
        ${active ? `<span class="badge badge-accent">진행중</span>` : `<span class="badge badge-muted">종료</span>`}
      </div>
      ${v.description ? `<p class="poll-desc">${escapeHTML(v.description)}</p>` : ""}
      ${active && !myVote ? `
        <div class="poll-options">
          ${sortedVoteOptions(v).map(o=>`
            <button class="poll-option" onclick="vote(${v.id},${o.id})">${escapeHTML(o.option_text)}</button>
          `).join("")}
        </div>` : ""}
      ${myVote ? `<p class="poll-done">✓ 투표에 참여했어요</p>` : ""}
      ${showResults ? renderVoteResults(v,responses,total,myVote) : ""}
      ${isStaff() ? `<div class="poll-admin"><button class="danger btn-sm" onclick="deleteVote(${v.id})">투표 삭제</button></div>` : ""}
    </div>
  `;
}

function renderVoteResults(v,responses,total,myVote){
  return `
    <div class="vote-result">
      ${total===0 ? `<p class="meta" style="margin:0 0 10px">아직 참여한 사람이 없어요.</p>` : ""}
      ${sortedVoteOptions(v).map(o=>{
        const count=responses.filter(r=>r.vote_id===v.id && r.option_id===o.id).length;
        const percent=total ? Math.round(count/total*100) : 0;
        const mine=myVote?.option_id===o.id;
        return `
          <div class="vote-row ${mine?"mine":""}">
            <div class="vote-row-head"><span>${escapeHTML(o.option_text)}${mine?" ✓":""}</span><span>${count}표 · ${percent}%</span></div>
            <div class="vote-bar"><div class="vote-bar-inner" style="width:${percent}%"></div></div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

async function createVote(){
  if(!isStaff())return;
  const titleRaw=document.getElementById("vTitle").value.trim();
  const descriptionRaw=document.getElementById("vDescription").value.trim();
  const optionsRaw=["v1","v2","v3","v4"].map(id=>document.getElementById(id).value.trim()).filter(Boolean);
  const expiresInput=document.getElementById("vExpires").value;
  if(!titleRaw||optionsRaw.length<2){ msg("질문과 선택지 2개 이상을 입력해주세요."); return; }

  const cleaned=cleanBotCheck(titleRaw,descriptionRaw,...optionsRaw);
  if(!cleaned)return;
  const [title,description,...options]=cleaned;

  const expires_at=expiresInput ? new Date(expiresInput).toISOString() : null;

  const {data:voteRow,error}=await supabase.from("votes").insert({title,description,author_id:currentUser.id,expires_at}).select().single();
  if(error){ msg("투표 생성 실패:\n"+error.message); return; }

  const {error:optionError}=await supabase.from("vote_options").insert(options.map(option_text=>({vote_id:voteRow.id,option_text})));
  if(optionError){
    await supabase.from("votes").delete().eq("id",voteRow.id);
    msg("선택지 등록 실패:\n"+optionError.message);
    return;
  }
  closeModal(); renderVotes();
}

async function vote(voteId,optionId){
  if(!currentUser){ msg("로그인이 필요합니다."); return; }
  const {data:existing}=await supabase.from("vote_responses").select("id").eq("vote_id",voteId).eq("user_id",currentUser.id).maybeSingle();
  if(existing){ msg("이미 이 투표에 참여했어요."); return; }

  const {error}=await supabase.from("vote_responses").insert({vote_id:voteId,option_id:optionId,user_id:currentUser.id});
  if(error){ msg(error.code==="23505" ? "이미 이 투표에 참여했어요." : "투표 실패:\n"+error.message); return; }

  msg("투표가 완료되었습니다!");
  renderVotes();
}

async function deleteVote(id){
  if(!isStaff())return;
  if(!confirm("이 투표를 삭제할까요?"))return;
  const {error}=await supabase.from("votes").delete().eq("id",id);
  if(error){ msg("삭제 실패:\n"+error.message); return; }
  renderVotes();
}

/* =========================================================
   📋 학급 게시판 (구 SNS, opinions 테이블)
   - 누구나 글쓰기 (실명제: 닉네임+학번 항상 공개)
   - 공감 (feed_likes에서 value=1만 사용)
   - 조회수: 글을 열 때 increment_opinion_view 함수를 호출합니다.
     ⚠️ board-views.sql을 Supabase SQL Editor에서 한 번 실행해야 동작합니다.
     한 사람이 같은 글을 여러 번 열어도 1번만 셉니다.
   - 클린봇 1차 필터, 링크 미리보기, 관리자 "채택" 시 포인트 지급
========================================================= */

// 보완된 유튜브 정규식: watch?v=, shorts/, embed/, live/, youtu.be/ 모두 지원.
// 쿼리스트링 순서(예: ?si=xxx&v=ID)가 달라도 매칭되며, videoId는 항상 11자로 고정.
const YOUTUBE_RE=/(?:youtube\.com\/(?:watch\?(?:[^\s]*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
const IMAGE_RE=/https?:\/\/\S+\.(?:png|jpe?g|gif|webp)(\?\S*)?/i;
const URL_RE=/https?:\/\/[^\s]+/i;

// 영상은 클릭 전까지 로드되지 않도록 썸네일+[보기] 버튼만 우선 표시합니다.
function renderLinkEmbed(text){
  const yt=text.match(YOUTUBE_RE);
  if(yt){
    const videoId=yt[1];
    return `
      <div class="video-placeholder" id="video-${videoId}-${Math.random().toString(36).slice(2,7)}">
        <img src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" loading="lazy" alt="영상 미리보기">
        <button onclick="playFeedVideo(this,'${videoId}')">▶ 보기</button>
      </div>
    `;
  }

  const img=text.match(IMAGE_RE);
  if(img){
    return `<div class="feed-post-embed"><img src="${escapeHTML(img[0])}" loading="lazy"></div>`;
  }

  // 유튜브/이미지가 아닌 일반 링크도 클릭해서 이동할 수 있도록 카드로 보여줍니다.
  const url=text.match(URL_RE);
  if(url){
    let domain=url[0];
    try{ domain=new URL(url[0]).hostname; }catch(e){}
    return `<a class="link-card" href="${escapeHTML(url[0])}" target="_blank" rel="noopener noreferrer"><b>🔗 ${escapeHTML(domain)}</b>${escapeHTML(url[0])}</a>`;
  }

  return "";
}

function playFeedVideo(btn,videoId){
  const wrap=btn.closest(".video-placeholder");
  wrap.outerHTML=`<div class="feed-post-embed"><iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>`;
}

const BOARD_PAGE_SIZE=15;
const BOARD_AUTHOR_FIELDS="nickname,handle,equipped_color,equipped_title,equipped_border";

let boardPosts=[];
let boardQuery="";
let boardSort="latest";
let boardPage=1;
let boardViewsEnabled=false;
const viewedPostIds=new Set();

function formatViewCount(value){
  const n=Number(value)||0;
  if(n>=10000){
    const scaled=n/10000;
    return `${scaled >= 10 ? scaled.toFixed(0) : scaled.toFixed(1).replace(/\.0$/, "")}만`;
  }
  return n.toLocaleString("ko-KR");
}

function boardLocked(){
  return Boolean(appSettings.sns_locked) && profile?.role!=="admin";
}

function summarizeLikes(likes){
  const positive=(likes||[]).filter(l=>l.value===1);
  return {likeCount:positive.length, liked:positive.some(l=>l.user_id===currentUser?.id)};
}

async function renderFeed(){
  showLoading();
  await loadSettings();

  const {data,error}=await supabase
    .from("opinions")
    .select(`*, profiles(${BOARD_AUTHOR_FIELDS}), feed_comments(count), feed_likes(user_id,value)`)
    .order("created_at",{ascending:false});

  if(error){ showError(error.message); return; }

  if(data.length) boardViewsEnabled="view_count" in data[0];
  boardPosts=data.map((post,i)=>({
    ...post,
    no:data.length-i,
    commentCount:post.feed_comments?.[0]?.count || 0,
    ...summarizeLikes(post.feed_likes)
  }));
  renderBoardList();
}

function filteredBoardPosts(){
  const q=boardQuery.trim().toLowerCase();
  const posts=!q ? [...boardPosts] : boardPosts.filter(post=>
    [post.title,post.content,post.profiles?.nickname,post.profiles?.handle]
      .some(value=>String(value||"").toLowerCase().includes(q))
  );
  if(boardSort==="popular"){
    posts.sort((a,b)=>b.likeCount-a.likeCount || (b.view_count||0)-(a.view_count||0) || b.no-a.no);
  }
  return posts;
}

function renderBoardList(){
  const locked=boardLocked();

  document.getElementById("app").innerHTML=`
    <div class="page-title">
      <h1>게시판</h1>
      <p>누구나 자유롭게 글을 쓰고, 공감과 댓글로 이야기하는 우리 반 게시판이에요.</p>
    </div>

    ${locked ? `<div class="lock-banner">🔒 관리자가 게시판 글쓰기와 댓글을 잠시 막아뒀어요. 글은 계속 읽을 수 있어요.</div>` : ""}
    ${isStaff() && !boardViewsEnabled && boardPosts.length
      ? `<div class="notify-banner">👀 조회수가 아직 꺼져 있어요. Supabase SQL Editor에서 board-views.sql을 한 번 실행하면 켜져요. (관리자에게만 보이는 안내)</div>`
      : ""}

    <div class="toolbar">
      <div class="board-tabs">
        <button class="board-tab ${boardSort==="latest"?"active":""}" onclick="setBoardSort('latest')">최신순</button>
        <button class="board-tab ${boardSort==="popular"?"active":""}" onclick="setBoardSort('popular')">공감순</button>
      </div>
      <div class="toolbar-right">
        <input class="input search-input" placeholder="제목, 내용, 작성자 검색" value="${escapeHTML(boardQuery)}" oninput="onBoardSearch(this.value)">
        <button class="primary" onclick="feedPostForm()" ${locked?"disabled":""}>✏️ 글쓰기</button>
      </div>
    </div>

    <div id="boardList"></div>
  `;
  renderBoardRows();
}

// 검색할 때는 목록만 다시 그려서 입력창 포커스가 유지되게 함
function renderBoardRows(){
  const el=document.getElementById("boardList");
  if(!el) return;

  const posts=filteredBoardPosts();
  const pageCount=Math.max(1,Math.ceil(posts.length/BOARD_PAGE_SIZE));
  boardPage=Math.min(Math.max(1,boardPage),pageCount);
  const pagePosts=posts.slice((boardPage-1)*BOARD_PAGE_SIZE, boardPage*BOARD_PAGE_SIZE);

  el.innerHTML=`
    <div class="board">
      <div class="board-head">
        <span class="c-no">번호</span><span>제목</span><span>작성자</span>
        <span class="c-date">날짜</span><span class="c-num">조회</span><span class="c-num">공감</span>
      </div>
      ${pagePosts.length
        ? pagePosts.map(boardRowHtml).join("")
        : `<div class="list-empty">${boardQuery.trim() ? "검색 결과가 없어요." : "아직 올라온 글이 없어요. 첫 글을 남겨보세요!"}</div>`}
    </div>
    ${pageCount>1 ? `
      <div class="pagination">
        ${Array.from({length:pageCount},(_,i)=>i+1).map(n=>`
          <button class="page-btn ${n===boardPage?"active":""}" onclick="setBoardPage(${n})">${n}</button>
        `).join("")}
      </div>
    ` : ""}
  `;
}

function boardRowHtml(post){
  const nickname=escapeHTML(post.profiles?.nickname || "알 수 없음");
  const nameStyle=post.profiles?.equipped_color ? `style="color:${escapeHTML(post.profiles.equipped_color)}"` : "";
  const views=boardViewsEnabled ? formatViewCount(post.view_count) : "-";
  const date=shortDate(post.created_at);

  return `
    <div class="board-row" onclick="openBoardPost(${post.id})">
      <span class="c-no">${post.is_featured ? "⭐" : post.no}</span>
      <span class="c-title">
        <span class="c-title-text">${escapeHTML(post.title || "제목 없음")}</span>
        ${post.commentCount ? `<span class="comment-count">[${post.commentCount}]</span>` : ""}
      </span>
      <span class="c-author handle-link" ${nameStyle} onclick="event.stopPropagation();showUserProfile('${escapeHTML(post.author_id)}')" title="프로필 보기">${nickname}</span>
      <span class="c-date">${date}</span>
      <span class="c-num">${views}</span>
      <span class="c-num ${post.liked?"liked":""}">${post.likeCount}</span>
      <span class="board-mobile-meta">${nickname} · ${date}${boardViewsEnabled ? ` · 조회 ${views}` : ""} · 공감 ${post.likeCount}</span>
    </div>
  `;
}

function onBoardSearch(value){
  boardQuery=value;
  boardPage=1;
  renderBoardRows();
}

function setBoardSort(sort){
  boardSort=sort;
  boardPage=1;
  renderBoardList();
}

function setBoardPage(page){
  boardPage=page;
  renderBoardRows();
  window.scrollTo(0,0);
}

// refresh=true면 로딩 화면 없이 같은 자리에서 다시 그림 (댓글/수정 후)
async function openBoardPost(id,refresh=false){
  setActiveNav("feed");
  if(!refresh) showLoading();

  const [postResult,commentsResult]=await Promise.all([
    supabase.from("opinions").select(`*, profiles(${BOARD_AUTHOR_FIELDS}), feed_likes(user_id,value)`).eq("id",id).maybeSingle(),
    supabase.from("feed_comments").select(`*, profiles(${BOARD_AUTHOR_FIELDS})`).eq("post_id",id).order("created_at")
  ]);

  if(postResult.error){ showError(postResult.error.message); return; }
  if(!postResult.data){ msg("삭제되었거나 없는 글이에요."); renderFeed(); return; }

  const post={...postResult.data, ...summarizeLikes(postResult.data.feed_likes)};
  boardViewsEnabled="view_count" in post;
  renderBoardPost(post, commentsResult.data||[]);
  if(!refresh) window.scrollTo(0,0);
  recordPostView(post);
}

function renderBoardPost(post,comments){
  const locked=boardLocked();
  const flagged=containsBadWord(post.content);
  const actions=
    (isStaff() && !post.is_featured ? `<button class="outline btn-sm" onclick="featurePost(${post.id})">⭐ 채택하기 (+${FEATURE_POINTS}P)</button>` : "")+
    (canEdit(post.author_id) ? `<button class="outline btn-sm" onclick="editPost('opinions',${post.id},'feed')">수정</button>` : "")+
    (canDelete(post.author_id) ? `<button class="danger btn-sm" onclick="deleteFeedPost(${post.id})">삭제</button>` : "");

  document.getElementById("app").innerHTML=`
    <button class="ghost back-btn" onclick="go('feed')">← 목록으로</button>

    <article class="card post">
      ${post.is_featured ? `<span class="badge badge-success">⭐ 채택된 글</span>` : ""}
      <h1 class="post-title">${escapeHTML(post.title || "제목 없음")}</h1>
      <div class="post-meta">
        <span class="post-author">${feedAuthorLabel(post.profiles,post.author_id)}</span>
        <span>${formatMetaTimestamp(post)}</span>
        ${boardViewsEnabled ? `<span>조회 <span id="postViewCount" data-post-id="${post.id}">${formatViewCount(post.view_count)}</span></span>` : ""}
      </div>

      <div class="post-body">${escapeHTML(post.content || "")}</div>
      ${renderLinkEmbed(post.content || "")}
      ${flagged ? `<div class="feed-warning">⚠️ 클린봇이 부적절한 표현을 감지한 글이에요.</div>` : ""}

      <div class="post-like">
        <button id="likeBtn" class="like-btn ${post.liked?"active":""}" onclick="toggleLike(${post.id})">
          <span class="like-icon">👍</span>
          <span>공감 <b class="like-count">${post.likeCount}</b></span>
        </button>
      </div>

      ${actions ? `<div class="post-actions">${actions}</div>` : ""}
    </article>

    <section class="card comments">
      <h3>댓글 <span class="comment-total">${comments.length}</span></h3>
      ${comments.length
        ? comments.map(renderFeedComment).join("")
        : `<p class="meta">아직 댓글이 없어요. 첫 댓글을 남겨보세요.</p>`}
      ${locked
        ? `<p class="meta">🔒 게시판이 잠겨 있어 댓글을 남길 수 없어요.</p>`
        : `<div class="comment-form">
             <textarea class="input" id="commentInput-${post.id}" rows="2" placeholder="댓글을 남겨보세요"></textarea>
             <button class="primary" onclick="addComment(${post.id})">등록</button>
           </div>`}
    </section>
  `;
}

function renderFeedComment(c){
  return `
    <div class="comment" id="feed-comment-${c.id}">
      <div class="comment-head">
        ${feedAuthorLabel(c.profiles,c.author_id)}
        <span class="meta">${formatMetaTimestamp(c)}</span>
        ${canDelete(c.author_id) ? `<button class="comment-del" onclick="deleteComment(${c.id},${c.post_id})">삭제</button>` : ""}
      </div>
      <div class="comment-body">${escapeHTML(c.content)}</div>
    </div>
  `;
}

// 글을 열 때 조회수 +1 (서버에서 한 사람당 1번만 셈)
async function recordPostView(post){
  if(!boardViewsEnabled || viewedPostIds.has(post.id)) return;
  viewedPostIds.add(post.id);

  const {data,error}=await supabase.rpc("increment_opinion_view",{p_post_id:post.id});
  if(error){ console.warn("조회수 반영 실패:",error.message); return; }
  if(typeof data!=="number") return;

  const el=document.getElementById("postViewCount");
  if(el && el.dataset.postId===String(post.id)) el.textContent=formatViewCount(data);
  const cached=boardPosts.find(p=>p.id===post.id);
  if(cached) cached.view_count=data;
}
